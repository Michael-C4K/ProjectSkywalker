// ── Plan for Floor (schema/23_access_rules.sql) ─────────────────────
// Leadership's button on a bill: the chair and vice chair of its committee each get a
// "floor brief needed" task in their To Do, the bill goes on their watchlist and on
// leadership's, and the bill is marked floor-ready. Drawn only for leadership and only
// on a bill of the current biennium; api_call() refuses anyone else whatever the page
// shows. When the database cannot tell which committee has the bill it asks.
function planFloorHTML(bi, bn){
  if (!(me && me.is_leadership) || bi !== me.biennium) return '';
  return `<div class="planfloor" id="planfloor" data-bn="${esc(bn)}">
    <button class="btn primary" data-pf="go">Plan for Floor</button>
    <span class="meta" style="flex:1 1 220px">Asks the committee's chair and vice chair for a floor brief, and puts the bill on their watchlist and yours.</span>
    <div id="pfmsg" class="meta" style="display:block;flex-basis:100%"></div></div>`;
}
async function pfClick(e){
  const box = document.getElementById('planfloor'), msg = document.getElementById('pfmsg');
  const bn = box.dataset.bn, pick = box.querySelector('select');
  msg.textContent = 'Sending…';
  const r = await apiCall('plan_for_floor', {bill_no: bn, committee_kpid: pick ? pick.value : ''});
  if (r && r.need_committee){
    const chamber = /^S/i.test(bn) ? 'Senate' : 'House';
    const opts = cmtList.filter(c => c.status === 'Active').sort((x, y) => (y.chamber === chamber) - (x.chamber === chamber) || cmName(x).localeCompare(cmName(y)));
    msg.innerHTML = `The record does not say which committee has this bill. Choose it, then press Plan for Floor again:
      <select style="margin-top:6px;max-width:100%">${opts.map(c => `<option value="${esc(c.kpid)}">${esc(cmName(c))}</option>`).join('')}</select>`;
    return;
  }
  if (!r || !r.ok){ msg.textContent = 'Not sent: ' + ((r && r.error) === 'offline' ? 'no connection' : ((r && r.error) || 'try again')); return; }
  const d = r.data;
  msg.textContent = d.alerted.length
    ? `Asked ${d.committee}: ${d.alerted.join(', ')}. It is in their To Do and on their watchlist and yours.`
    : `Nobody was alerted: no chair or vice chair of ${d.committee} has an access code linked to that committee yet. The bill is on your watchlist and marked floor-ready.`;
  serverWatch.add(`${me.biennium}|${d.bill_no}`);
  updateWatchCount();
  ensureMe(true);
  // Plan for Floor is the decision "bring to the floor": show it as decided.
  decPromise = null;
  ensureDecisions().then(() => paintDecBox(me.biennium, d.bill_no));
}

// ── General Orders: the floor list, typed in the night before ────────
// (schema/22_general_orders.sql.) Nothing else on the site says what is COMING to the
// floor: the feed is what has happened. The Activity screen has a switch - Recent
// activity | General Orders - and the second asks api_call() for the lists (live, so a
// list shows the moment it is saved; one run when the switch is first used). Anyone
// with a code reads it; leadership, leadership staff and the office's Tier 1 codes get
// the "Enter General Orders" button, and the database checks the save again.
let feedMode = 'recent';
const gord = {data: null, loading: false, error: ''};
async function loadGO(){
  gord.loading = true; gord.error = '';
  const r = await apiCall('general_orders', {});
  gord.loading = false;
  if (r && r.ok) gord.data = r.data;
  else gord.error = !access ? 'General Orders need an access code.'
    : (r && r.error === 'offline') ? 'Could not reach the list. Check your connection.'
    : 'Could not load General Orders' + (r && r.error ? ': ' + r.error : '.');
  if (currentTab === 'feed') render('feed');
  renderAside();
}
// The switch on the Activity screen and on the banner. On the banner, Hearings opens

const feedToggleHTML = (mode, where) => `<div class="subnav" style="margin-bottom:10px">

// The office enters each floor day's list the evening before. If nothing has been
// entered since the last business day, say so plainly rather than show an old list as

function goStaleHTML(){
  const d = gord.data;

  const lastBiz = new Date();
  do { lastBiz.setDate(lastBiz.getDate() - 1); } while (lastBiz.getDay() === 0 || lastBiz.getDay() === 6);
  lastBiz.setHours(0, 0, 0, 0);
  const last = d.last_entered_at ? new Date(d.last_entered_at) : null;
  if (last && last >= lastBiz) return '';
  return `<div class="staleflag">${last ? 'General Orders have not been updated since ' + esc(last.toLocaleDateString([], {weekday: 'long', month: 'short', day: 'numeric'}))
    : 'No General Orders have been entered yet'}. The office adds each floor day's list the evening before.</div>`;
}
function generalOrdersHTML(){
  if (!gord.data && !gord.loading && !gord.error) loadGO();
  if (!gord.data) return gord.error ? `<div class="bubble" style="margin-top:8px"><b>${esc(gord.error)}</b></div>`
                                    : `<div class="tick">Loading General Orders…</div>`;
  const days = gord.data.days || [], stale = goStaleHTML();
  const enter = gord.data.can_edit
    ? `<div class="slot-actions" style="margin:10px 0 14px"><button class="btn primary" data-go="new">Enter General Orders</button></div>` : '';

    <div style="height:16px"></div>` + enter;
  return stale + days.map(d => `<h2>${esc(d.chamber)} · ${esc(new Date(d.date + 'T12:00:00').toLocaleDateString([], {weekday: 'long', month: 'short', day: 'numeric'}))}
      ${gord.data.can_edit ? `<button class="pill" data-go="edit" data-date="${esc(d.date)}" data-chamber="${esc(d.chamber)}" style="margin-left:auto">Edit</button>` : ''}</h2>` +
    d.bills.map((b, i) => `<div class="tick${stageCls(b.stage)}"${stageAttr(b.stage)} data-open="${esc(gord.data.biennium + '|' + b.bill_no)}">
      <b>${i + 1}. ${billNo(b.bill_no)}</b> ${stageChip(b.stage)}
      <div>${esc(b.title || 'Not a bill in the current data')}</div></div>`).join('')).join('') + enter;
}
function openGOForm(date, chamber){

    <label>Bills, in the order they will be taken up
      <textarea data-f="bills" rows="8" placeholder="HB2001
SB10
HCR5001" autocapitalize="characters" spellcheck="false">${cur ? esc(cur.bills.map(b => b.bill_no).join('\n')) : ''}</textarea></label>
    <div class="meta" style="display:block;margin-top:4px">One bill to a line, or separated by commas.</div>

    <div class="calrow" style="justify-content:flex-end;align-items:center">

async function goClick(e){
  const b = e.target.closest('[data-go]'), act = b.dataset.go;
  if (act === 'new') return openGOForm();
  if (act === 'edit') return openGOForm(b.dataset.date, b.dataset.chamber);
  if (act === 'cancel') return closeDetail();
  const form = document.getElementById('goform'), msg = document.getElementById('gomsg');
  const f = k => form.querySelector(`[data-f="${k}"]`);
  // "hb 2001, SB10" -> ["HB2001", "SB10"]: a space inside a number is closed up first.
  const bills = act === 'clear' ? [] : f('bills').value.toUpperCase().replace(/([A-Z])\s+(\d)/g, '$1$2')
    .split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);
  if (act === 'save' && !bills.length){ msg.textContent = 'List at least one bill.'; return; }
  const unknown = billIndex && gord.data
    ? bills.filter(x => !billIndex.some(bb => bb.b === gord.data.biennium && bb.n === x)) : [];
  if (unknown.length){ msg.textContent = `Not a bill this biennium: ${unknown.join(', ')}. Check the number.`; return; }
  msg.textContent = act === 'clear' ? 'Clearing…' : 'Saving…';
  const r = await apiCall('general_orders_save', {chamber: f('chamber').value, date: f('date').value, bills});
  if (!r.ok){ msg.textContent = 'Not saved: ' + (r.error === 'offline' ? 'no connection' : (r.error || 'try again')); return; }
  await loadGO();
  closeDetail();

// ── the committee calendar (schema/21_committee_calendar.sql) ───────
// LIVE, not published: the page asks api_call() for a window of days and draws the
// answer. Anyone with a code may read it; a committee's chair, vice chair or staff -
// or leadership - may add a day, list the bills to be taken up and say what the
// business is on each (testimony, amendments, pass it, kill it, discussion). `can_edit`
// on each day and the `editable` list only decide which buttons are drawn: the
// database checks every save again, and a page edited by its reader gets "not your
// committee". One Retool run per month viewed, one per save - nothing polls.
const cal = {month: null, data: null, loading: false, error: ''};
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const BUSINESS = [['testimony', 'Testimony', ''], ['amendments', 'Amendments', 'warn'],
                  ['pass', 'Pass it', 'ok'], ['kill', 'Kill it', 'bad'], ['discussion', 'Discussion', '']];
const busPill = b => { const x = BUSINESS.find(y => y[0] === b); return x ? `<span class="pill ${x[2]}">${x[1]}</span>` : ''; };
// A day's committee sittings, from the month on screen or the three-month plan list.
function calDaysOn(date){
  const seen = new Set(), out = [];
  for (const d of [...((cal.data && cal.data.days) || []), ...((cal.agenda && cal.agenda.days) || [])])
    if (d.date === date && !seen.has(d.day_id)){ seen.add(d.day_id); out.push(d); }
  return out;
}
let calMode = 'days';            // the calendar's own switch: days | plans | decisions

// ── a leadership office's decisions (schema/24_decisions.sql) ───────
// Chairman Plans used to be a screen of its own; since 2026-10-01 a plan IS a calendar
// entry (the committee day, the bill, the business). A leadership office answers with
// its own decision on the bill, in the office's words: Bring to Floor Now, Wait, Never
// Bring to Floor, Kill. A decision is PRIVATE TO THE OFFICE THAT MADE IT: api_call()
// returns it only to codes of that office - not to the chair or vice chair, not to
// another leadership office - and the page draws the control and the Decisions list for
// leadership only. Wait, Never Bring to Floor and Kill tell nobody anything. Bring to
// Floor Now is the one that acts: like the Plan for Floor button, it asks the bill's
// committee - chair and vice chair - for a floor brief (they get that request in their
// To Do; they are still never sent the decision or its note).
const DECISIONS = [['floor', 'Bring to Floor Now', 'ok'], ['wait', 'Wait', 'warn'],
                   ['never', 'Never Bring to Floor', 'bad'], ['kill', 'Kill', 'bad']];
function decPill(d){
  const x = d && DECISIONS.find(y => y[0] === d.decision);
  if (!x) return '';
  const tip = [d.note, d.by ? 'by ' + d.by : '', d.at ? new Date(d.at).toLocaleDateString() : ''].filter(Boolean).join(' · ');
  return `<span class="pill ${x[2]}" title="${esc(tip)}">Decision: ${x[1]}</span>`;
}
const decideSelect = (bn, cur) => `<select data-decide="${esc(bn)}" aria-label="Leadership decision on ${esc(bn)}">
    <option value="none">No decision</option>${DECISIONS.map(([k, l]) =>
      `<option value="${k}" ${cur === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const dec = {list: null, by: new Map(), can: false, bi: '', loading: false, error: ''};
let decPromise = null;
async function loadDecisions(){
  dec.loading = true;
  const r = await apiCall('decisions', {});
  dec.loading = false;
  if (r && r.ok){
    dec.list = r.data.decisions || []; dec.can = !!r.data.can_decide; dec.bi = r.data.biennium || '';
    dec.by = new Map(dec.list.map(x => [x.bill_no, x])); dec.error = '';
  } else dec.error = 'Could not load the decisions.';
  if (currentTab === 'calendar' && calMode === 'decisions') renderCalendar();
  return dec;
}
const ensureDecisions = () => decPromise || (decPromise = loadDecisions());
async function saveDecision(bn, decision, note){
  const r = await apiCall('decision_save', {bill_no: bn, decision, note: note || ''});
  if (r && r.ok){
    decPromise = null;
    await ensureDecisions();
    if (cal.data) await loadCalendar();
    if (cal.agenda) await loadAgenda();
  }
  return r;
}
// The decision on a bill's own pop-up: leadership chooses and may leave a note for the
// chair; the committee's chair and vice chair see what was decided; nobody else sees
// anything here.
function paintDecBox(bi, bn, msg){
  const box = document.getElementById('decbox');
  if (!box || box.dataset.bn !== bn) return;
  box.className = ''; box.innerHTML = '';
  // Leadership only: nobody else is ever sent a decision, so there is nothing to draw.
  if (!(me && me.is_leadership) || bi !== me.biennium) return;
  const cur = dec.by.get(bn);
  box.className = 'planfloor';
  box.innerHTML = `<b style="flex-basis:100%">Your office's decision</b>${decideSelect(bn, cur ? cur.decision : 'none')}
    <input data-decide-note="${esc(bn)}" placeholder="A note for your office (optional)" value="${esc((cur && cur.note) || '')}" style="flex:1 1 200px">
    <div id="decmsg" class="meta" style="display:block;flex-basis:100%">${esc(msg || (cur
      ? `Decided by ${cur.by || 'your office'} on ${new Date(cur.at).toLocaleDateString([], {month: 'short', day: 'numeric'})}. Only your office sees this.`
      : 'Only your office sees this. Bring to Floor Now also asks the chair and vice chair for a floor brief.'))}</div>`;
}
document.addEventListener('change', async e => {
  let sel = e.target.closest('[data-decide]');
  const noteEl = e.target.closest('[data-decide-note]');
  // Changing only the note saves it with the decision already chosen.
  if (!sel && noteEl) sel = document.querySelector(`#decbox [data-decide="${CSS.escape(noteEl.dataset.decideNote)}"]`);

// ── routing ─────────────────────────────────────────────────────────
// Pages is static, so routes live in the hash. Before this the app had no URLs at
// all — you could not send anyone a link to a bill, bookmark one, or press Back.
// For an office where "send me the link" is a daily operation that was the most
// expensive gap in the product, and it is a functional one, not a cosmetic one.
//
// applyingRoute guards the obvious loop: applyRoute() calls the same open* functions
// that a click does, and those set the URL. Without the guard they fight each other.
const TABS = ['feed', 'watch', 'notes', 'search', 'calendar', 'members', 'orgs', 'stats'];
let applyingRoute = false;

function go(hash, replace){
  if (applyingRoute || location.hash === hash) return;
  try {
    if (replace) history.replaceState(null, '', hash);
    else history.pushState(null, '', hash);
  } catch { location.hash = hash; }   // file:// and some embedded views reject pushState
}

function tabRoute(){
  const t = currentTab === 'watch' ? '' : (currentTab === 'feed' && feedMode === 'hearings') ? 'hearings' : currentTab;
  const q = document.getElementById('q').value.trim();
  // The box filters members and organizations too, so those views are equally worth
  // sharing — "the orgs list filtered to 'realtors'" is a link someone will want.
  const carries = ['search', 'members', 'orgs'].includes(currentTab) || t === 'hearings';
  const p = new URLSearchParams();
  if (q && carries) p.set('q', q);
  if (currentTab === 'orgs' && orgGroup !== 'stakeholders') p.set('g', orgGroup);
  const qs = p.toString();
  return '#/' + t + (qs ? '?' + qs : '');
}

function parseRoute(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  return {
    parts: path ? path.split('/').map(decodeURIComponent) : [],
    q: new URLSearchParams(qs || ''),
  };
}

async function applyRoute(){
  applyingRoute = true;
  try {
    const {parts, q} = parseRoute();
    let [kind, a, b] = parts;
    if (kind === 'bills') kind = 'search';   // the tab is called Bills; the route kept its name
    if (kind === 'bill' && a && b){ if (!lastTab) render('watch'); return await openBill(a + '|' + b); }
    if (kind === 'member' && a){ if (!lastTab) render('members'); return openPerson(a); }
    if (kind === 'hearing' && a && b){
      await ensureHearings();
      if (!lastTab){ feedMode = 'hearings'; render('feed'); }
      return openHearing(a + '|' + b);
    }
    if (kind === 'org' && a){ if (!lastTab) render('orgs'); return ensureOrgs().then(() => openOrg(a)); }
    if (dlg.open) dlg.close();
    const term = q.get('q');
    // Hearings is a part of Activity now; its old address still lands on it.
    if (kind === 'hearings'){ feedMode = 'hearings'; return render('feed', {q: term}); }
    if (kind === 'feed' && feedMode === 'hearings') feedMode = 'recent';
    const tab = TABS.includes(kind) ? kind : 'watch';
    if (tab === 'orgs') orgGroup = q.get('g') || orgGroup || 'stakeholders';
    // A shared link to a filtered list arrives filtered; a plain one arrives as the
    // screen was last left.
    render(tab, term !== null ? {q: term} : {});
  } finally { applyingRoute = false; }
}
addEventListener('hashchange', applyRoute);
addEventListener('popstate', applyRoute);

// Closing the dialog must drop the detail route, or Back re-opens what you just shut.
//
// This deliberately does NOT rely on the dialog's own `close` event. Measured in this
// environment, `close` does not fire at all: `open` flips true -> false and no listener
// runs, including one attached seconds earlier. Same family as smooth scrollIntoView
// silently doing nothing here. So every path that closes the dialog goes through this
// function, and the `close` listener below is a belt-and-braces extra rather than the
// mechanism.
function closeDetail(){
  if (dlg.open) dlg.close();
  if (!applyingRoute) go(tabRoute(), true);
}
dlg.addEventListener('close', () => { if (!applyingRoute) go(tabRoute(), true); });
// Escape closes a <dialog> natively; catch it so the route is cleaned up too.
dlg.addEventListener('cancel', () => { if (!applyingRoute) go(tabRoute(), true); });

// ── tiers: personal access codes, shared notes, reporting ───────────
// A code unlocks one tier's notes. Nothing here is a permission CHECK — the page could
// be edited to skip any if-statement. The notes arrive encrypted (tiers/t1..t4.json) and
// a code is the only way to get the key; ops/process_inbox.py re-checks everything the
// page sends. See schema/11_tier_access.sql for the whole model.
//
//   Tier 1 the office · Tier 2 leadership · Tier 3 chairs & vice chairs · Tier 4 others
LS.code   = 'skywalker.code.v1';     // the person's code — needed to unlock each visit
LS.report = 'skywalker.report.v1';   // is the report box ticked (survives sessions)
LS.period = 'skywalker.period.v1';   // {id, since}: reporting started when box was ticked
LS.device = 'skywalker.device.v1';
LS.aud    = 'skywalker.aud.v1';      // last "who can see it" choice
LS.sent   = 'skywalker.sent.v1';     // fingerprint of the last report, to skip repeats
let access = null;                   // {tier, verifier, items}

const AUD = {me: 'Only me', t1: 'Tier 1', t12: 'Tiers 1–2', t123: 'Tiers 1–3', all: 'Everyone'};
const AUD_BY_TIER = {1: ['me', 't1', 't12', 't123', 'all'], 2: ['me', 't12', 't123', 'all'],
                     3: ['me', 'all'], 4: ['me']};
const audLabel = a => AUD[a] || AUD.me;
const audOptions = () => (AUD_BY_TIER[access?.tier] || ['me']).map(v => [v, AUD[v]]);
const lastAud = () => { const v = load(LS.aud, 'me'); return audOptions().some(([x]) => x === v) ? v : 'me'; };

const te = new TextEncoder(), td = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const hexBytes = s => Uint8Array.from(String(s || '').match(/../g) || [], h => parseInt(h, 16));
// Must match publish/tier_crypto.py normalize_code(): no I, L, O or U in a code, so
// the look-alikes fold back to digits.
const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '')
                        .replace(/O/g, '0').replace(/[IL]/g, '1');
const sha256hex = async s => hexOf(await crypto.subtle.digest('SHA-256', te.encode(s)));
async function aesOpen(raw, iv, data){
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv}, k, data));

// Plain fetch, not getJSON: a site published before any code was issued has no tiers/
// folder, and that is not an error worth a badge.
async function tierFile(name){
  const r = await fetch(`${BASE}/tiers/${name}`, {cache: 'no-cache'});
  if (!r.ok) throw new Error(`tiers/${name}: HTTP ${r.status}`);
  return r.json();
}

// Returns {tier, verifier, items} or null when the code is not in the keyring.
async function unlock(code){
  const norm = normCode(code);
  const ring = await tierFile('keyring.json');
  // Finding our own entry is DELIBERATELY SLOW (PBKDF2, not a plain hash). The keyring
  // is downloadable by anyone, so a fast fingerprint would let someone guess codes
  // offline at billions per second - which a 16-character code would not survive. This
  // costs about a fifth of a second, once, at sign-in. Must match
  // publish/tier_crypto.py lookup_of(); changing one without the other locks everybody out.
  const lbase = await crypto.subtle.importKey('raw', te.encode('lookup:' + norm), 'PBKDF2', false, ['deriveBits']);
  const e = ring.entries?.[hexOf(await crypto.subtle.deriveBits(
    {name: 'PBKDF2', hash: 'SHA-256', salt: hexBytes(ring.lsalt), iterations: ring.iter}, lbase, 64))];
  if (!e) return null;
  const base = await crypto.subtle.importKey('raw', te.encode(norm), 'PBKDF2', false, ['deriveBits']);
  const wrap = await crypto.subtle.deriveBits(
    {name: 'PBKDF2', hash: 'SHA-256', salt: b64d(e.s), iterations: ring.iter}, base, 256);
  const inner = JSON.parse(td.decode(await aesOpen(wrap, b64d(e.n), b64d(e.w))));
  const f = await tierFile(`t${inner.tier}.json`);
  const data = JSON.parse(td.decode(await aesOpen(b64d(inner.key), b64d(f.n), b64d(f.c))));
  return {tier: inner.tier, verifier: await sha256hex('verify:' + norm), items: data.items || {},
          site: inner.site};
}

// ── the live side: whip counts, committee plans, briefs, the board ──
// Everything above this line is PUBLISHED data - built hourly, encrypted, read from
// files. Everything below is LIVE: the page asks the database a question and the answer
// depends on who is asking. A deputy whip's request for the whip board comes back with
// only their own members, because api_call() applies the rule server-side. Nothing here
// is trusted to do that, and nothing here should ever try.
let apiUrl;                          // undefined = not looked up yet, null = no API
async function apiCall(action, payload){
  if (!access) return {ok: false, error: 'locked'};
  if (apiUrl === undefined){
    try { apiUrl = (await getJSON('tiers/api.json')).url || null; } catch { apiUrl = null; }
  }
  if (!apiUrl) return {ok: false, error: 'no api'};
  let r;
  try {
    // text/plain is the one cross-site POST a browser makes without asking the server
    // for permission first. Unlike the note reports this one reads the reply, which
    // works because the Retool workflow answers with access-control-allow-origin: *.
    r = await fetch(apiUrl, {method: 'POST', headers: {'Content-Type': 'text/plain'},
                             body: JSON.stringify({v: access.verifier, action, payload: payload || {}})});
  } catch (e){
    return {ok: false, error: 'offline'};
  }
  let d;
  try { d = await r.json(); } catch { return {ok: false, error: 'bad reply'}; }
  // Retool has returned the workflow's answer as a list of rows, as columns, and as the
  // bare object, depending on version. The workflow deliberately does not pick one
  // (docs/RETOOL_SETUP.md), so unpick it here - same logic as ops/api_check.py unwrap().
  for (let i = 0; i < 4; i++){
    if (Array.isArray(d) && d.length) d = d[0];
    else if (d && typeof d === 'object' && 'result' in d && !('ok' in d)) d = d.result;
    else break;
  }
  return (d && typeof d === 'object') ? d : {ok: false, error: 'bad reply'};
}

// ── the lock ────────────────────────────────────────────────────────
// The site is private (decided 2026-09-16): nothing loads until a valid code unlocks
// the site key. Without one, all a visitor gets is this screen - the data files
// themselves are unreadable ciphertext.
async function start(){
  updateNotesCount();
  let locked = true;
  try {
    const r = await fetch(`${BASE}/tiers/keyring.json`, {cache: 'no-cache'});
    // Only a bundle built with no keys at all (a purely local install) has no keyring;
    // ops/publish_to_pages.py refuses to upload such a bundle.
    locked = r.status !== 404;
  } catch { /* offline: treat as locked */ }
  if (!locked){ revealApp(); updateAccessUI(); return boot(); }

  const code = load(LS.code, '');
  if (!code) return showLock();
  let got = null;
  try { got = await unlock(code); }
  catch (e) {
    trackErr({kind: 'unlock', msg: String(e.message).slice(0, 200)});
    return showLock('Could not check your access code. Check your connection, then reload.', true);
  }
  if (!got){
    // Revoked, or a code that was never published. Forget it.
    save(LS.code, ''); save(LS.report, false);
    return showLock('That access code is no longer active. Ask the office for a new one.');
  }
  access = got;
  siteKey = await crypto.subtle.importKey('raw', b64d(got.site), 'AES-GCM', false, ['decrypt']);
  revealApp();
  updateAccessUI();
  boot();
}

// Tabs, search, the access button and the report box start hidden in the HTML, so a
// locked page never flashes the app's controls while the code is being checked.
function revealApp(){
  // One menu for everyone; the leadership entries show for tiers 1-3 (the database
  // decides what each of them actually gets).
  Skywalker.buildTray({nav: document.getElementById('tabs'), page: 'index',
                       who: {tier: access ? access.tier : null}, active: trayOf(currentTab)});
  updateNotesCount();
  document.querySelector('nav').hidden = false;
  document.getElementById('qwrap').hidden = false;
  document.getElementById('aside').hidden = false;
  document.getElementById('keybtn').hidden = false;
  document.getElementById('reportbox').hidden = REPORTING_RETIRED;
  raiseReportBox();
}

function showLock(message, keepCode){
  hideSplash();
  document.getElementById('exportfab').hidden = true;
  document.querySelector('nav').hidden = true;
  document.getElementById('qwrap').hidden = true;
  document.getElementById('aside').hidden = true;
  document.getElementById('keybtn').hidden = true;
  const box = document.getElementById('reportbox');
  try { box.hidePopover(); } catch {}
  box.hidden = true;
  document.getElementById('asof').textContent = 'private';
  view.innerHTML = `
    <div class="lock">
      <div class="lock-logo">SKYWALKER</div>
      <div class="bubble"><b>Skywalker is private.</b>Enter the personal access code the office
        gave you. You only need to do this once on each device.</div>
      <div class="slot" aria-hidden="true"><svg class="i"><use href="#i-lock"/></svg></div>
      <div class="card">
      <form id="lockform">
        <!-- LETTING THE BROWSER REMEMBER THE CODE (asked for 2026-09-22).
             A password manager only offers to save when it can see a credential, which
             means three things together: a real <form>, a field of type="password" with
             autocomplete="current-password", and a username field to file it under.
             The username here is a fixed label rather than the person's name, which
             nothing knows at this point - it becomes the entry's title in the manager.
             It is off-screen rather than display:none, because a hidden field is
             ignored by some managers. The field used to say autocomplete="off", which
             told every browser NOT to offer. -->
        <input type="text" name="username" value="Skywalker access code"
               autocomplete="username" readonly tabindex="-1" aria-hidden="true"
               style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none">
        <input id="lockcode" class="codefield" type="password" name="code" autocomplete="current-password"
               autocapitalize="characters" spellcheck="false" enterkeyhint="go"
               placeholder="CARP-XXXX-XXXX-XXXX" aria-label="Access code">
        <label class="meta" style="display:flex;gap:6px;align-items:center;justify-content:center;
                                   cursor:pointer;font-size:13px">
          <input type="checkbox" id="lockshow" style="width:auto;margin:0"> Show the code
        </label>
        <button class="btn primary">Unlock</button>
        <div id="lockmsg" class="meta" style="display:block;min-height:1.5em">${esc(message || '')}</div>
      </form>
      </div>
    </div>`;
  const form = document.getElementById('lockform');
  form.onsubmit = async ev => {
    ev.preventDefault();
    const code = document.getElementById('lockcode').value;
    const msg = document.getElementById('lockmsg');
    if (!normCode(code)){ msg.textContent = 'Type your access code.'; return; }
    msg.textContent = 'Checking…';
    let got = null;
    try { got = await unlock(code); }
    catch { msg.textContent = 'Could not check the code right now. Check your connection and try again.'; return; }
    if (!got){
      msg.textContent = 'That code was not recognised. A new code starts working after the next update.';
      return;
    }
    save(LS.code, normCode(code));
    // Ask the browser to remember it. Chrome and Edge offer on this call; Firefox and
    // Safari decide for themselves from the form above, which is why both exist. It is
    // only ever an OFFER - the person says yes or no, and nothing is stored by us.
    try {
      if (window.PasswordCredential && navigator.credentials){
        await navigator.credentials.store(new window.PasswordCredential({
          id: 'Skywalker access code', password: normCode(code), name: 'Skywalker'}));
      }
    } catch { /* declined, unsupported, or an insecure context: never fatal */ }
    location.reload();
  };
  document.getElementById('lockshow').onchange = ev => {
    document.getElementById('lockcode').type = ev.target.checked ? 'text' : 'password';
  };
  // Enter (or "Go" on a phone keyboard) submits. Browsers do this for a form with a
  // button on their own, but not every one does it reliably, so ask for it explicitly.
  document.getElementById('lockcode').addEventListener('keydown', ev => {
    if (ev.key === 'Enter'){ ev.preventDefault(); form.requestSubmit(); }
  });
  if (!keepCode) document.getElementById('lockcode').focus();
}

async function askForCode(){
  if (!access) return;
  if (!confirm(`Sign out of Skywalker on this device? You will need your access code to get back in.`)) return;
  save(LS.code, ''); save(LS.report, false);
  location.reload();
}

// ── the report box ──────────────────────────────────────────────────
const reportChk = document.getElementById('reportchk');
const reportOn = () => !REPORTING_RETIRED && !!(access && load(LS.report, false));
function setReport(on){
  const was = load(LS.report, false);
  save(LS.report, !!on);
  // Ticking starts a NEW period: only notes written from now on are sent. The id keeps
  // periods apart on the server, so re-ticking can never disturb what was already filed.
  if (on && !was){ save(LS.period, {id: newId(), since: new Date().toISOString()}); save(LS.sent, ''); }
  updateAccessUI();
  refreshAnnot();
  if (on) scheduleReport();
}
reportChk.onchange = () => {
  if (reportChk.checked && !access){
    reportChk.checked = false;
    askForCode();
    return;
  }
  setReport(reportChk.checked);
};
function updateAccessUI(){
  const btn = document.getElementById('keybtn');
  btn.textContent = access ? `Tier ${access.tier}` : 'Access code';
  btn.classList.toggle('on', !!access);
  const box = document.getElementById('reportbox');
  reportChk.checked = reportOn();
  box.classList.toggle('on', reportOn());
  box.classList.toggle('off-code', !access);
  box.title = access ? 'When ticked, notes you write from now on are sent to leadership'
                     : 'Needs a personal access code';
}
document.getElementById('keybtn').onclick = askForCode;
document.getElementById('exportfab').onclick = () => exportAnnotations();

// Keep the box above everything, including an open detail dialog. The top layer stacks
// in the order things enter it, so the box is re-entered after every dialog opens.
// Browsers without popover support simply show it as an ordinary fixed element.
function raiseReportBox(){
  const box = document.getElementById('reportbox');
  if (REPORTING_RETIRED || !box.showPopover) return;
  try { if (box.matches(':popover-open')) box.hidePopover(); box.showPopover(); } catch {}
}
{
  const dialog = document.getElementById('detail');
  const open = dialog.showModal.bind(dialog);
  dialog.showModal = () => { open(); raiseReportBox(); };
}
raiseReportBox();

function inPeriod(n){
  const p = load(LS.period, null);
  return !!(reportOn() && p && (n.at || '') >= p.since);
}
function sendable(n){
  // Tier 1-2 "only me" is truly private: never sent, ticked or not.
  return inPeriod(n) && !((n.aud || 'me') === 'me' && access.tier <= 2);
}
function reportedPill(n){
  return access && sendable(n) ? ' <span class="pill ok">Reported</span>' : '';
}

function deviceId(){
  let d = load(LS.device, '');
  if (!d){ d = newId(); save(LS.device, d); }
  return d;
}
function reportPayload(){
  const p = load(LS.period, null);
  if (!reportOn() || !p) return null;
  const notes = [];
  for (const a of Object.values(annot))
    for (const n of a.notes)
      if (sendable(n)) notes.push({id: n.id, type: a.type, key: a.key, label: a.label,
                                   body: n.body, at: n.at, aud: n.aud || 'me'});
  // Every report carries ALL of this period's notes, not just the newest: a deleted note
  // is then simply absent, and a report that got lost is repaired by the next one.
  return {format: 'skywalker-report/1', v: access.verifier, device: deviceId(),
          period: p.id, notes};
}

let inboxUrl, reportTimer = null;
async function sendReport(final){
  const body = reportPayload();
  if (!body) return;
  const fp = await sha256hex(JSON.stringify(body));
  const last = load(LS.sent, '');
  // Nothing new since the last report, or a period with nothing in it yet: skip. Each
  // request is a Retool Workflow run against a monthly allowance.
  if (fp === last || (!body.notes.length && !last)) return;
  if (inboxUrl === undefined){
    // Sealed like every other data file, so the webhook address is private too.
    try { inboxUrl = (await getJSON('tiers/inbox.json')).url || null; } catch { inboxUrl = null; }
  }
  if (!inboxUrl) return;
  const json = JSON.stringify(body);
  try {
    // no-cors + text/plain is the one cross-site POST a browser sends without asking the
    // server first, and keepalive lets it finish while the tab closes. The price is an
    // unreadable reply — which is why every report is complete rather than incremental.
    await fetch(inboxUrl, {method: 'POST', mode: 'no-cors', keepalive: final && json.length < 60000,
                           headers: {'Content-Type': 'text/plain'}, body: json});
    save(LS.sent, fp);
  } catch (e) {
    trackErr({kind: 'report', msg: String(e.message).slice(0, 200)});
  }
}
function scheduleReport(){
  if (!reportOn()) return;
  clearTimeout(reportTimer);
  // Several notes in a row become one request.
  reportTimer = setTimeout(() => sendReport(false), 20000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && reportOn()){ clearTimeout(reportTimer); sendReport(true); }
});

// ── shared notes, shown under the reader's own ──────────────────────
function sharedItemHTML(i){
  return `<div class="shared"><div class="meta">
      <span class="pill">${esc(cap(i.k))}</span>${i.by ? `<span>${esc(i.by)}</span>` : ''}
      ${i.d ? `<span>${esc(i.d)}</span>` : ''}<span>Seen by ${esc(i.a)}</span></div>
    ${i.x ? `<div><b>${esc(i.x)}</b></div>` : ''}<div class="stext">${esc(i.t || '')}</div></div>`;
}
function sharedHTML(ekey, ownNotes){
  if (!access) return '';
  const mine = new Set((ownNotes || []).map(n => n.id));
  const items = (access.items[ekey] || []).filter(i => !(i.n && mine.has(i.n)));
  if (!items.length) return '';
  return `<div style="margin-top:10px"><b>Shared with you (${items.length})</b>
    ${items.map(sharedItemHTML).join('')}</div>`;
}
// The "Shared with Tier N" box was taken off the Notes tab on 2026-09-30 at the office's
// request. Notes shared on an item still appear when that item is opened; the few
// general notes (shared with no item) are listed plainly here when there are any.
function generalSharedHTML(){
  if (!access) return '';
  const items = access.items.general || [];
  return items.length ? `<div class="card"><b>Shared with you</b>${items.map(sharedItemHTML).join('')}</div>` : '';
}

start();
</script>
