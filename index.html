<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The look (skywalker.css) and the shell (skywalker.js: themes, the tab tray, the
     loading screen) are shared with leadership.html, so 'self' is allowed for styles
     and scripts. Nothing from any other address is ever loaded. -->
<!-- All data is untrusted input: legislative text, testimony presenter names, and
     organization names all originate outside this office. The CSP is a backstop for
     the escaping in the render path, not a substitute for it. -->
<!-- Private site: never listed by search engines (robots.txt says the same). -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'self'; style-src 'unsafe-inline' 'self'; connect-src 'self' https://api.retool.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Skywalker — Kansas Legislature</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f6fd6'/%3E%3Cpath d='M12 5l2 4.2 4.6.6-3.4 3.2.9 4.5L12 15.3 7.9 17.5l.9-4.5L5.4 9.8 10 9.2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="skywalker.css">
</head>
<body>
<!-- The loading screen: the brand and the empty slot with the cursor round it, until the
     first screen is ready or the lock screen takes its place (hideSplash). -->
<div id="splash" aria-label="Loading"><div class="splash-box">
  <div class="slot"><svg class="i"><use href="#i-star"/></svg></div>
  <div class="splash-brand">SKYWALKER</div>
  <div class="splash-msg"><i class="led"></i>Loading…</div>
</div></div>
<header>
  <div class="bar">
    <div class="brand">SKYWALKER<small><i class="led" id="led"></i><span id="asof">loading…</span></small></div>
    <label class="search" id="qwrap" hidden>
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search bills, sponsors, topics…" autocomplete="off" aria-label="Search">
    </label>
    <button id="keybtn" hidden class="pill keybtn" type="button" title="Enter your personal access code">Access code</button>
    <button id="themebtn" type="button" aria-label="Colour theme and motion" aria-expanded="false" title="Colour theme"></button>
  </div>
  <!-- The theme panel: seven washes (the 3DS theme shop, in miniature) and the motion
       switch. Each swatch shows the wash and the accent it comes with. -->
  <div id="themepanel" hidden>
    <h3>Colour</h3>
    <div class="swatches">
      <button class="swatch" data-theme-pick="slate"    style="--sw:#d3dae2;--sw2:#2f6fd6" title="Slate"><span>Slate</span></button>
      <button class="swatch" data-theme-pick="rose"     style="--sw:#f7bccd;--sw2:#c92a6b" title="Rose"><span>Rose</span></button>
      <button class="swatch" data-theme-pick="sky"      style="--sw:#b3d9f5;--sw2:#0c6fc4" title="Sky"><span>Sky</span></button>
      <button class="swatch" data-theme-pick="mint"     style="--sw:#bfe8cd;--sw2:#1b7f4d" title="Mint"><span>Mint</span></button>
      <button class="swatch" data-theme-pick="lavender" style="--sw:#d4c9f0;--sw2:#5d3fb8" title="Lavender"><span>Lavender</span></button>
      <button class="swatch" data-theme-pick="peach"    style="--sw:#f9cfae;--sw2:#c2521c" title="Peach"><span>Peach</span></button>
      <button class="swatch" data-theme-pick="night"    style="--sw:#1b1f27;--sw2:#7db6ff" title="Night"><span>Night</span></button>
    </div>
    <label class="toggle"><span>Motion<small>Drifting background, sheen, tiles that move</small></span>
      <input type="checkbox" id="motionchk"><span class="knob"></span></label>
  </div>
</header>

<main>
  <!-- The tab tray. Watchlist is the home screen; Activity is a tab on phones and the
       banner down the right on wide screens (the button hides itself there). -->
  <!-- The tab tray is drawn by Skywalker.buildTray (skywalker.js) from the ONE menu both
       pages share: Watchlist is the home screen; Activity is a tab on phones and the
       banner down the right on wide screens; the leadership entries appear for tiers
       1-3 and are links to leadership.html. The Analysis tab was taken off the menu
       2026-09-30 at the office's request; its code (renderStats, tab 'stats') is kept. -->
  <nav id="tabs" hidden></nav>
  <div class="deck" id="deck">
    <div id="view"></div>
    <aside id="aside" hidden aria-label="Recent activity"></aside>
  </div>
</main>

<dialog id="detail">
  <div class="dhead">
    <div class="grow"><span id="dno" class="bill-no"></span><div id="dtitle" class="title"></div></div>
    <button class="close" id="dlink" aria-label="Copy link to this item"
            title="Copy link">🔗</button>
    <button class="close" id="dclose" aria-label="Close">×</button>
  </div>
  <div class="dbody" id="dbody"></div>
</dialog>
<!-- The one hover card (a popover, so it shows above an open dialog). -->
<div id="hover" hidden popover="manual" role="dialog" aria-label="Details"></div>

<button id="exportfab" hidden class="btn primary fab" type="button" title="Write your notes, flags and tags to a file"><svg class="i"><use href="#i-note"/></svg> Export notes</button>
<label id="reportbox" hidden popover="manual" title="When ticked, notes you write from now on are sent to leadership">
  <input type="checkbox" id="reportchk"> <span id="reportlbl">Report new notes to leadership</span>
</label>

<script src="skywalker.js"></script>
<script>
// ── config ──────────────────────────────────────────────────────────
// Data lives beside the page. Relative paths so this works from any host.
const BASE = './data-bundle';

// Short marks per kind for the changes feed. changes.json comes from the change record
// (schema/17_feed.sql), which reports more kinds than the two this feed used to build
// for itself. An unrecognised kind renders its wording and no mark - never an error,
// never a blank row: the database may learn a new kind years after this page was last
// edited.
//
// DECLARED HERE, NOT INSIDE render(). tickHTML() is called from earlier in render()
// than a const declared beside it would be initialised, so the first UNGROUPED change
// threw "Cannot access 'TICK_MARK' before initialization" and emptied the feed. It did
// not show up in testing because out of session every change arrives in a bulk group,
// and groups do not call tickHTML at all - it would have surfaced on the first day of
// session (found 2026-09-22).
const TICK_MARK = {
  bill_action: '', bill_new: 'NEW', bill_status: 'STATUS', bill_version: 'VERSION',
  vote: 'VOTE', hearing: 'HEARING', hearing_status: 'HEARING', governor: 'GOVERNOR',
  member_status: 'MEMBER', committee_roster: 'COMMITTEE'
};
// Version PDFs stay on the legislature's own site rather than being mirrored: they are
// the authoritative printing, and 38 GB of documents has no business in a Pages repo.
const DOCBASE = 'https://kslegislature.gov';
const LS = {
  watch: 'skywalker.watch.v1',   // bill keys the user tracks
  seen:  'skywalker.seen.v1',    // per-bill last-seen change timestamp
  theme: 'skywalker.theme.v1',
  motion:'skywalker.motion.v1',  // the Motion switch in the theme panel
  errs:  'skywalker.errlog.v1'   // ring buffer of runtime errors (see below)
};

// RETIRED 2026-09-30, NOT DELETED. The site is now for chairs and leadership only, not
// rank-and-file members, so "report new notes to leadership" has no one to serve. The
// box is no longer shown AND nothing is sent, even for someone who ticked it before -
// hiding the box alone would have left those people silently reporting for ever. Every
// part of the mechanism (the inbox workflow, process_inbox.py, note_inbox) is kept:
// set this back to false to bring it back.
// Declared up here, not beside reportOn(): revealApp() sits earlier in the file, and a
// const read before its line runs throws (the TICK_MARK crash, 2026-09-22).
const REPORTING_RETIRED = true;

// ── error tracking ──────────────────────────────────────────────────
// Pages is static: there is no server to phone home to, and the CSP forbids external
// calls anyway (deliberately — no services, nothing the office doesn't own). So errors
// are captured to a localStorage ring buffer on the DEVICE where they happened, a
// badge appears on the data-age line, and one tap copies a full diagnostic report.
// The support path this enables: a staffer says "it broke", you say "tap the badge,
// paste what it copied" — instead of "what were you doing? what phone? can you
// reproduce it?".
//
// Registered before anything else runs so even a syntax-level failure later in this
// script gets recorded on the next load.
const ERRMAX = 50;
function trackErr(entry){
  try {
    const buf = JSON.parse(localStorage.getItem(LS.errs) || '[]');
    buf.push({t: new Date().toISOString(), url: location.hash, ...entry});
    while (buf.length > ERRMAX) buf.shift();
    localStorage.setItem(LS.errs, JSON.stringify(buf));
  } catch {}
  try { updateErrBadge(); } catch {}
}
addEventListener('error', e => trackErr({
  kind: 'js', msg: String(e.message || '').slice(0, 300),
  src: `${(e.filename || '').split('/').pop()}:${e.lineno || 0}`}));
addEventListener('unhandledrejection', e => trackErr({
  kind: 'promise', msg: String(e.reason && e.reason.message || e.reason).slice(0, 300)}));

function errBuf(){ try { return JSON.parse(localStorage.getItem(LS.errs) || '[]'); } catch { return []; } }

function updateErrBadge(){
  const el = document.getElementById('asof');
  if (!el) return;
  let b = document.getElementById('errbadge');
  const n = errBuf().length;
  if (!n){ if (b) b.remove(); return; }
  if (!b){
    b = document.createElement('button');
    b.id = 'errbadge';
    b.style.cssText = 'margin-left:6px;border:1px solid var(--bad);color:var(--bad);' +
      'background:none;border-radius:6px;font-size:10px;padding:1px 7px;cursor:pointer';
    b.title = 'Copy error report and clear';
    b.onclick = async ev => {
      ev.stopPropagation();
      const report = JSON.stringify({
        app: 'skywalker', data_as_of: manifest?.generated_at || null,
        ua: navigator.userAgent, copied_at: new Date().toISOString(),
        errors: errBuf(),
      }, null, 1);
      let copied = false;
      try { await navigator.clipboard.writeText(report); copied = true; } catch {}
      // clipboard needs https/localhost; fall back to showing the report so it can
      // be copied by hand rather than silently doing nothing
      if (!copied) prompt('Copy this error report:', report);
      localStorage.removeItem(LS.errs);
      updateErrBadge();
    };
    el.after(b);
  }
  b.textContent = `${n} error${n === 1 ? '' : 's'}`;
}

// ── tiny state helpers (preferences live on the DEVICE, by design) ──
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// Corrupt or hand-edited localStorage must not kill the page before any handler
// attaches — `new Set(<non-iterable>)` throws at module scope.
const stored = load(LS.watch, []);
let watch = new Set(Array.isArray(stored) ? stored : []);
let seen  = (() => { const s = load(LS.seen, {}); return (s && typeof s === 'object' && !Array.isArray(s)) ? s : {}; })();
let manifest = null, billIndex = null, changes = [], upcoming = [];
// Analytics load on demand — they are only needed by the Members and Analysis tabs.
let members = null, allies = null, lifecycle = null;

const key = b => `${b.b}|${b.n}`;             // biennium|billno
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── colour that says where a bill is ────────────────────────────────
// The same helpers and words as publish/site/leadership.html (there they build DOM
// nodes, here HTML strings, as the rest of this page does). Keep them in step.
const STAGE_WORD = {introduced: 'Introduced', committee: 'In committee', floor: 'On the floor',
                    governor: 'Governor', law: 'Law', dead: 'Dead'};
const STAGES = new Set(Object.keys(STAGE_WORD));
// Only a known word ever becomes a class name: the stage arrives in the bundle, and
// nothing from the bundle is put into markup unchecked.
const stageOk = g => STAGES.has(g) ? g : null;
const stageChip = (g, words) => stageOk(g)
  ? `<span class="stage st-${g}">${esc(words || STAGE_WORD[g])}</span>` : '';
const stageAttr = g => stageOk(g) ? ` data-stage="${g}"` : '';
const stageCls = g => stageOk(g) ? ` st-${g}` : '';

// ── breathing colour, and the cards behind the chips (2026-09-30) ──
// Three small files, loaded once at boot, give the page who everyone is:
//   roleOf      person id -> {party, role, title}       (what colour a name breathes)
//   personInfo  person id -> {name, chamber, district, leads, chairs, sits}
//   cmtList / cmtByKpid / cmtByName   the latest biennium's committees, with rosters,
//                                     meeting time and room
// A person who is a chair somewhere and a vice chair elsewhere counts as a chair;
// anyone on the leadership roster counts as leadership. Everything the hover cards
// show comes from here, so a card never waits on the network.
let roleOf = {}, personInfo = {}, legByKpid = {}, cmtList = [], cmtByKpid = {}, cmtByName = {};
let legsAll = [], cmtsAll = [], leadsAll = [], curBi = null;   // every biennium, for the Members tab
let rolesPromise = null;
// A committee's name as people say it: "House Education", "Senate Ways and Means";
// special and joint committees keep their full title.
const cmName = c => ((c.chamber === 'House' || c.chamber === 'Senate') ? c.chamber + ' ' : '')
  + (c.title || c.display_name || '');
// The same key for "House Committee on Education", "House Education" and "Education".
const cmKey = s => String(s || '').toLowerCase().replace(/^(house|senate|joint)\s+/, '')
  .replace(/^committee on\s+/, '').replace(/[^a-z]/g, '');
const cmChamber = s => /^house\b/i.test(s || '') ? 'House' : /^senate\b/i.test(s || '') ? 'Senate' : '';
function buildRoles(legs, cmts, leads, sched){
  legs = Array.isArray(legs) ? legs : []; cmts = Array.isArray(cmts) ? cmts : []; leads = Array.isArray(leads) ? leads : [];
  legsAll = legs; cmtsAll = cmts; leadsAll = leads;
  scheduleByKpid = {};
  for (const s of (Array.isArray(sched) ? sched : [])){
    if (!s || !s.kpid) continue;
    const e = (scheduleByKpid[s.kpid] ||= {weekly: [], dates: {}});
    if (s.date) e.dates[s.date] = s; else e.weekly.push(s);
  }
  roleOf = {}; personInfo = {}; legByKpid = {}; cmtList = []; cmtByKpid = {}; cmtByName = {};
  const latest = [...new Set(legs.map(l => l.biennium))].sort().reverse()[0];
  curBi = latest || curBi;
  const byKpid = {};
  for (const l of legs){
    if (l.biennium !== latest) continue;
    const p = String(l.party || '').charAt(0).toUpperCase();
    const pid = String(l.person_id);
    roleOf[pid] = {party: p === 'R' || p === 'D' ? p : '', role: 'member', title: ''};
    personInfo[pid] = {name: l.full_name || '', party: roleOf[pid].party, chamber: cap(l.chamber),
                       district: l.district || '', leads: [], chairs: [], sits: []};
    byKpid[l.kpid] = pid; legByKpid[l.kpid] = l;
  }
  const RANK = {member: 0, vice_chair: 1, chair: 2, leadership: 3};
  const give = (kpid, role, title) => {
    const r = roleOf[byKpid[kpid]];
    if (r && RANK[role] > RANK[r.role]){ r.role = role; r.title = title; }
  };
  for (const c of cmts){
    if (c.biennium !== latest) continue;
    cmtList.push(c); cmtByKpid[c.kpid] = c;
    (cmtByName[cmKey(c.title || c.display_name)] ||= []).push(c);
    for (const m of roster(c)){
      const pi = personInfo[byKpid[m.kpid]];
      if (!pi) continue;
      if (m.role === 'chair' || m.role === 'vice_chair'){
        pi.chairs.push({c, role: m.role});
        give(m.kpid, m.role, (m.role === 'chair' ? 'Chair of ' : 'Vice chair of ') + cmName(c));
      } else pi.sits.push(c);
    }
  }
  for (const l of leads){
    if (l.biennium !== latest) continue;
    give(l.member_kpid, 'leadership', l.title || 'Leadership');
    const pi = personInfo[byKpid[l.member_kpid]];
    if (pi && l.title) pi.leads.push(l.title);
  }
}
// A committee's roster with each person once. The published roster repeats people
// (the API gives members, chairs and vice chairs as three lists, and a chair is in
// all of them); the highest role wins.
function roster(c){
  const RANK = {member: 0, vice_chair: 1, chair: 2};
  const best = new Map();
  for (const m of c.members || []){
    const cur = best.get(m.kpid);
    if (!cur || RANK[m.role] > RANK[cur.role]) best.set(m.kpid, {kpid: m.kpid, role: m.role});
  }
  return [...best.values()];
}
const cap = s => { s = String(s || ''); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; };
const biLabel = b => { const m = /^b(\d{4})_(\d{2})$/.exec(b || ''); return m ? `${m[1]}–${m[2]}` : String(b || ''); };
// ── the committee schedule, and "meeting now" ──
// data/committee_schedule.json comes from publish/committee_schedule.csv (see
// docs/EDITING_THE_WEBSITE.md): days of the week, a start and an end, per committee.
// The Legislature's API gives a time and a room but not the days, so until the office
// fills that file in, nothing is ever "meeting now". Device time is used: everyone who
// reads this is in Kansas.
let scheduleByKpid = {};
// A dated row (a moved or cancelled meeting) wins over the weekly pattern for that day.
function meetingNow(kpid, now){
  now = now || new Date();
  const day = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const hm = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
  const cur = now.getHours() * 60 + now.getMinutes();
  const within = s => s && s.start && s.end && cur >= hm(s.start) && cur < hm(s.end) ? s : null;
  // The chairs' calendar knows today best, when it has been opened this visit.
  const cd = cal.data ? (cal.data.days || []).find(d => d.date === day && d.committee_kpid === kpid) : null;
  if (cd) return cd.cancelled ? null : within(cd);
  const e = scheduleByKpid[kpid];
  if (!e) return null;
  const o = e.dates[day];
  if (o) return o.cancelled ? null : within(o);
  for (const s of e.weekly) if (Array.isArray(s.days) && s.days.includes(now.getDay()) && within(s)) return s;
  return null;
}
const clock12 = t => { const [h, m] = String(t).split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m || 0).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; };
const nowBox = (c, s) => `<div class="nowbox"><i class="led"></i>In committee now · ${esc(cmName(c))} · until ${esc(clock12(s.end))}${s.room ? ' · Room ' + esc(s.room) : ''}</div>`;
function ensureRoles(){
  if (!rolesPromise) rolesPromise = Promise.all([
    getJSON('data/legislators.json').catch(() => []),
    getJSON('data/committees.json').catch(() => []),
    getJSON('data/leadership.json', {optional: true}).catch(() => []),
    getJSON('data/committee_schedule.json', {optional: true}).catch(() => []),
  ]).then(([legs, cmts, leads, sched]) => buildRoles(legs, cmts, leads, sched));
  return rolesPromise;
}
// Every breathing chip on the page is on ONE clock: the delay winds each new chip
// back to where the shared 18-second cycle (6 s for two colours, 9 s for three) is
// right now, so chips drawn at different moments rise and fall together.
const syncDelay = () => `animation-delay:-${Date.now() % 18000}ms`;
const GLYPH = {chair: '◆', vice_chair: '◇', leadership: '★'};
const ROLE_WORD = {chair: 'chair', vice_chair: 'vice chair', leadership: 'leadership'};
// A legislator's name on its breathing colour. `party` is a fallback letter for
// someone the roster does not know (an earlier biennium's roll call). Known people get
// a hover card and a click (their page).
function nameChip(name, pid, party){
  const known = personInfo[String(pid)];
  const r = roleOf[String(pid)] || {party: party === 'R' || party === 'D' ? party : '', role: 'member', title: ''};
  const tip = [r.party === 'R' ? 'Republican' : r.party === 'D' ? 'Democrat' : '', r.title].filter(Boolean).join(' · ');
  return `<span class="nm ${r.party} ${r.role}" style="${syncDelay()}" title="${esc(tip)}"${known ? ` data-hover="person" data-pid="${esc(pid)}" role="link" tabindex="0"` : ''}>${esc(name)}${
    GLYPH[r.role] ? `<i aria-label="${ROLE_WORD[r.role]}">${GLYPH[r.role]}</i>` : ''}</span>`;
}
// Each committee's own pastel: a hue from its name, spread around the wheel so two
// committees that sort together do not look alike. "House Committee on Judiciary",
// "House Judiciary" and "Judiciary" (the journey's word) land on the same hue.
function cmHue(name){
  const k = cmKey(name);
  let h = 0;
  for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return Math.round((h % 1000) * 137.508) % 360;
}
// opts.kpid names the exact committee when the caller knows it (hearings do).
const cmChip = (name, opts = {}) => name
  ? `<span class="cm" style="--h:${cmHue(name)};${syncDelay()}" data-hover="cmt" data-name="${esc(name)}" data-ch="${esc(opts.chamber || cmChamber(name))}" data-kpid="${esc(opts.kpid || '')}" role="button" tabindex="0">${esc(name)}</span>` : '';
// The committees a chip could mean: the exact one by kpid, else by name, narrowed to
// the chamber when the name or the caller says which.
function findCmts(name, chamber, kpid){
  if (kpid && cmtByKpid[kpid]) return [cmtByKpid[kpid]];
  const list = cmtByName[cmKey(name)] || [];
  const ch = chamber || cmChamber(name);
  const narrowed = ch ? list.filter(c => c.chamber === ch) : [];
  return narrowed.length ? narrowed : list;
}
const hueCls  = (stage, cmt) => stage === 'committee' && cmt ? ' hue' : '';
const hueAttr = (stage, cmt) => stage === 'committee' && cmt ? ` style="--h:${cmHue(cmt)}"` : '';
// H for House bills, S for Senate bills: orange and purple. With a biennium the number
// also gets a hover card (feed rows, tables); inside a bill's own tile it does not,
// because the tile already says all of it.
const bnCls = n => /^S/i.test(String(n || '')) ? 'S' : /^H/i.test(String(n || '')) ? 'H' : '';
const billNo = (n, bi) => `<span class="bill-no ${bnCls(n)}"${bi ? ` data-hover="bill" data-bi="${esc(bi)}" data-bn="${esc(n)}"` : ''}>${esc(n)}</span>`;
function setDno(text, bn){
  const el = document.getElementById('dno');
  el.textContent = text; el.className = 'bill-no ' + (bn ? bnCls(text) : '');
}
// A sponsor is a legislator (with a person id) or a committee (a name only).
function sponsorHTML(name, pid){
  if (pid != null && pid !== '') return nameChip(name, pid);
  if (/committee/i.test(name || '')) return cmChip(name);
  return esc(name);
}

// ── the hover cards ─────────────────────────────────────────────────
// Mouse over a name, a committee or a bill number and a card says what it is; click a
// name for the legislator's page, click a committee to pin its card (that is how a
// phone, which has no hover, gets at it). One card element for the whole page, shown
// as a popover so it sits above an open dialog too. Everything on it is already on
// the device: the roster files for people and committees, the bill index for bills
// (loaded on the first bill card if it has not been yet).
const hoverEl = document.getElementById('hover');
let hoverKey = null, hoverTimer = null, hoverPinned = false, hoverAnchor = null;
const canHover = matchMedia('(hover: hover)').matches;
const row = (label, html) => html ? `<div class="hc-row"><b>${label}</b> ${html}</div>` : '';
function personCardHTML(pid){
  const pi = personInfo[String(pid)];
  if (!pi) return '';
  const chips = list => list.map(c => cmChip(cmName(c), {kpid: c.kpid})).join(' ');
  const chairs = pi.chairs.filter(x => x.role === 'chair').map(x => x.c);
  const vices  = pi.chairs.filter(x => x.role === 'vice_chair').map(x => x.c);
  return `<div class="hc-head">${nameChip(pi.name, pid)}</div>
    <div class="meta">${esc([pi.party === 'R' ? 'Republican' : pi.party === 'D' ? 'Democrat' : '', pi.chamber,
      pi.district ? 'district ' + pi.district : ''].filter(Boolean).join(' · '))}</div>
    ${row('Leadership', esc(pi.leads.join(' · ')))}
    ${row('Chair of', chips(chairs))}${row('Vice chair of', chips(vices))}
    ${row('Sits on', chips(pi.sits) || '<span class="meta">No committee</span>')}
    ${(() => { const n = [...pi.chairs.map(x => x.c), ...pi.sits].map(c => [c, meetingNow(c.kpid)]).find(x => x[1]); return n ? nowBox(n[0], n[1]) : ''; })()}
    <div class="hc-foot">Click the name for their page</div>`;
}
function cmtCardHTML(c){
  const live = meetingNow(c.kpid);
  const who = role => roster(c).filter(m => m.role === role)
    .map(m => legByKpid[m.kpid]).filter(Boolean)
    .map(l => nameChip(l.full_name || l.kpid, l.person_id, String(l.party || '').charAt(0)));
  const members = who('member');
  // The API gives a meeting time and a room; it does not say which days. When it gives
  // neither, say so rather than leaving a blank (the office may fill these in later -
  // see docs/WHERE_WE_ARE.md, "Still to do").
  const meets = [c.mtg_time, c.mtg_room ? 'Room ' + c.mtg_room : ''].filter(Boolean).map(esc).join(' · ')
    || '<span class="meta">Meeting time and room not in the data yet</span>';
  return `<div class="hc-head">${cmChip(cmName(c), {kpid: c.kpid})}</div>
    <div class="meta">${esc([c.chamber === 'Both' ? 'Joint' : c.chamber, c.committee_type,
      c.status && c.status !== 'Active' ? cap(c.status) : ''].filter(Boolean).join(' · '))}</div>
    ${live ? `<div class="nowbox"><i class="led"></i>Meeting now · until ${esc(clock12(live.end))}</div>` : ''}
    ${row('Meets', meets)}
    ${row('Chair', who('chair').join(' '))}${row('Vice chair', who('vice_chair').join(' '))}
    ${row(`Members (${members.length})`, members.slice(0, 30).join(' ') + (members.length > 30 ? ` <span class="meta">+${members.length - 30} more</span>` : ''))}`;
}
function billHoverHTML(bi, bn){
  if (!billIndex){
    ensureBillIndex().then(() => { if (hoverKey === 'bill:' + bi + '|' + bn && hoverAnchor) showHover(hoverAnchor, hoverKey, billHoverHTML(bi, bn)); }).catch(() => {});
    return `<div class="hc-head">${billNo(bn)}</div><div class="meta">Loading…</div>`;
  }
  const b = billIndex.find(x => x.b === bi && x.n === bn);
  if (!b) return `<div class="hc-head">${billNo(bn)}</div><div class="meta">Not in the current data.</div>`;
  const sp = (b.sp || []).map((nm, i) => sponsorHTML(nm, (b.si || [])[i]));
  return `<div class="hc-head">${billNo(bn)} <span class="meta">${esc(biLabel(bi))}</span></div>
    <div class="hc-title">${esc(b.t || b.l || '')}</div>
    <div class="meta" style="margin-top:6px">${stageChip(b.g)} ${b.g === 'committee' && b.c ? cmChip(b.c) : ''} <span class="pill">${esc(b.s || 'status unknown')}</span></div>
    ${row('Introduced by', sp.join(' '))}
    <div class="hc-foot">Click the number to open the bill</div>`;
}
function hoverContent(t){
  const kind = t.dataset.hover;
  if (kind === 'person') return ['person:' + t.dataset.pid, personCardHTML(t.dataset.pid)];
  if (kind === 'bill')   return ['bill:' + t.dataset.bi + '|' + t.dataset.bn, billHoverHTML(t.dataset.bi, t.dataset.bn)];
  if (kind === 'cmt'){
    const list = findCmts(t.dataset.name, t.dataset.ch, t.dataset.kpid);
    if (!list.length) return ['cmt:' + t.dataset.name,
      `<div class="hc-head">${cmChip(t.dataset.name)}</div><div class="meta">Not in this biennium's committee list.</div>`];
    return ['cmt:' + list.map(c => c.kpid).join(','), list.map(cmtCardHTML).join('<hr class="hc-sep">')];
  }
  return [null, ''];
}
function showHover(anchor, key, html){
  hoverKey = key; hoverAnchor = anchor;
  hoverEl.innerHTML = html;
  hoverEl.hidden = false;
  try { if (!hoverEl.matches(':popover-open')) hoverEl.showPopover(); } catch {}
  const r = anchor.getBoundingClientRect(), w = hoverEl.offsetWidth, h = hoverEl.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - w - 8);
  let y = r.bottom + 6;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
  hoverEl.style.left = x + 'px'; hoverEl.style.top = y + 'px';
}
function hideHover(){
  clearTimeout(hoverTimer);
  hoverKey = null; hoverPinned = false; hoverAnchor = null;
  try { hoverEl.hidePopover(); } catch {}
  hoverEl.hidden = true;
}
function scheduleHide(){
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => { if (!hoverPinned) hideHover(); }, 220);
}
document.addEventListener('mouseover', e => {
  if (!canHover || hoverPinned) return;
  const t = e.target.closest('[data-hover]');
  if (!t){ if (hoverKey && !e.target.closest('#hover')) scheduleHide(); return; }
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => {
    const [key, html] = hoverContent(t);
    if (key && key !== hoverKey) showHover(t, key, html);
  }, 160);
});
document.addEventListener('mouseout', e => {
  if (!canHover || hoverPinned || !hoverKey) return;
  const to = e.relatedTarget;
  if (to && to.closest && (to.closest('#hover') || to.closest('[data-hover]'))) return;
  scheduleHide();
});
// A click on a chip: a name opens the legislator; a committee pins (or unpins) its
// card; a bill number is left to whatever holds it (a link, a tile).
function chipClick(e){
  const p = e.target.closest('[data-hover="person"]');
  if (p){ e.stopPropagation(); e.preventDefault(); hideHover(); openPerson(p.dataset.pid); return true; }
  const c = e.target.closest('[data-hover="cmt"]');
  if (c){
    e.stopPropagation(); e.preventDefault();
    const [key, html] = hoverContent(c);
    if (hoverPinned && key === hoverKey) hideHover();
    else { showHover(c, key, html); hoverPinned = true; }
    return true;
  }
  return false;
}
hoverEl.onclick = e => { chipClick(e); };
document.addEventListener('click', e => {
  if (hoverPinned && !e.target.closest('#hover') && !e.target.closest('[data-hover="cmt"]')) hideHover();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && hoverKey) hideHover();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-hover="person"],[data-hover="cmt"]')){
    e.preventDefault(); chipClick({target: e.target, stopPropagation(){}, preventDefault(){}});
  }
});
addEventListener('scroll', () => { if (hoverKey) hideHover(); }, {capture: true, passive: true});
addEventListener('resize', () => { if (hoverKey) hideHover(); });
function openPerson(pid){
  ensureAnalytics().catch(() => {}).then(() => openMember(pid));
}

function journeyHTML(j){
  if (!j || !Array.isArray(j.steps) || !j.steps.length) return '';
  const g = stageOk(j.stage) || 'introduced';
  // "House Taxation": the chamber from the step's label, so the chip finds the right
  // committee (both chambers have a Taxation committee).
  const here = j.steps.find(s => s.state === 'current' || s.state === 'died') || {};
  const cmt = here.sub ? ((cmChamber(here.label) ? cmChamber(here.label) + ' ' : '') + here.sub) : '';
  const fmt = d => d ? new Date(d + 'T12:00:00').toLocaleDateString([], {month: 'short', day: 'numeric'}) : '';
  const WORD = {done: 'done', current: 'here now', died: 'stopped here', todo: 'not yet'};
  const steps = j.steps.map((s, i) => {
    const state = WORD[s.state] ? s.state : 'todo';
    const sub = [s.sub, fmt(s.date)].filter(Boolean).join(' · ');
    return `<div class="jstep ${state}${i === 2 ? ' turn' : ''}" role="listitem"
        title="${esc(s.label + (s.sub ? ' - ' + s.sub : '') + (s.date ? ', ' + fmt(s.date) : '') + ' (' + WORD[state] + ')')}">
      ${i === 2 ? '<span class="jturn">turnaround</span>' : ''}
      <span class="jdot"></span><b>${esc(String(s.label || '').replace(' committee', ' cmte'))}</b>
      ${sub ? `<span class="jsub">${esc(sub)}</span>` : ''}</div>`;
  }).join('');
  return `<div class="journey st-${g}${hueCls(g, cmt)}"${hueAttr(g, cmt)} role="list" aria-label="${esc('Where this bill is: ' + (j.where || ''))}">${steps}</div>
    <div class="jnote">${stageChip(g, j.where)}${g === 'committee' && cmt ? ' ' + cmChip(cmt) : ''}${j.conference ? ' <span class="pill">Went to conference</span>' : ''}</div>`;
}

// Every member who voted, one dot each: Republicans, then Democrats, each dot filled by
// how they voted and ringed in their party's colour.
function seatMapHTML(votes){
  const way = v => v === 'yea' ? 'y' : v === 'nay' ? 'n' : 'o';
  const rank = {y: 0, n: 1, o: 2};
  const pty = x => x.y === 'R' || x.y === 'D' ? x.y : '?';
  const groups = ['R', 'D', '?'].map(p => votes.filter(x => pty(x) === p)
    .sort((a, b) => rank[way(a.v)] - rank[way(b.v)]));
  const cnt = (p, w) => votes.filter(x => pty(x) === p && way(x.v) === w).length;
  const dots = groups.filter(g => g.length).map(g => g.map(x =>
    `<span class="seat ${way(x.v)} ${pty(x)}" title="${esc((x.n || '') + ': ' + ({y: 'yes', n: 'no', o: 'did not vote'}[way(x.v)]))}"></span>`
  ).join('')).join('<span class="gap"></span>');
  return `<div class="seats" role="img" aria-label="Republicans ${cnt('R','y')} yes, ${cnt('R','n')} no; Democrats ${cnt('D','y')} yes, ${cnt('D','n')} no">${dots}</div>
    <div class="seats-key"><span><span class="seat inline y"></span> Yes</span>
      <span><span class="seat inline n"></span> No</span>
      <span><span class="seat inline y R"></span> Republican</span>
      <span><span class="seat inline y D"></span> Democrat</span></div>`;
}

// ── boot ────────────────────────────────────────────────────────────
// fetch() only rejects on network failure — a 404 resolves with an HTML body and
// then .json() throws somewhere far away. Check res.ok at the source.
// opts.optional: a file newer than the bundle may not exist yet (a 404 is not an error
// worth a badge). Everything else is tracked.
async function getJSON(path, opts = {}){
  // Every failure mode is tracked with the path: HTTP status (missing/misdeployed
  // file), network failure (offline, server down), and parse failure (truncated or
  // corrupted JSON — which a half-finished deploy can produce).
  let res;
  try {
    res = await fetch(`${BASE}/${path}`);
  } catch (e) {
    trackErr({kind: 'net', msg: String(e.message).slice(0, 200), src: path});
    throw e;
  }
  if (!res.ok){
    if (!(opts.optional && res.status === 404)) trackErr({kind: 'http', msg: `HTTP ${res.status}`, src: path});
    throw new Error(`${path}: HTTP ${res.status}`);
  }
  try {
    // Locked site: every data file is nonce + AES-GCM(gzip(json)) under the site key,
    // which only a valid access code can unwrap (see the tiers section below).
    if (!siteKey) return await res.json();
    try {
      return await openSealed(await res.arrayBuffer());
    } catch (first) {
      // GitHub Pages lets browsers cache files for 10 minutes. Right after the site key
      // rotates (a revoked code) - or after the switch from the old open site - the
      // cached copy is under an old key, or not encrypted at all, and will not open.
      // Fetch past the cache once before calling it an error.
      const fresh = await fetch(`${BASE}/${path}`, {cache: 'reload'});
      if (!fresh.ok) throw first;
      return await openSealed(await fresh.arrayBuffer());
    }
  } catch (e) {
    trackErr({kind: 'parse', msg: String(e.message).slice(0, 200), src: path});
    throw e;
  }
}
let siteKey = null;   // CryptoKey for the whole site; null until a code unlocks it
async function openSealed(buf){
  const b = new Uint8Array(buf);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, siteKey, b.slice(12));
  const text = await new Response(
    new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}

const hideSplash = () => Skywalker.hideSplash();

function fail(msg, detail){
  hideSplash();
  document.getElementById('view').innerHTML =
    `<div class="card empty"><p><strong>${esc(msg)}</strong></p>
     <p><small>${esc(detail || '')}</small></p></div>`;
}

async function boot(){
  updateErrBadge();   // errors from a previous visit surface immediately
  try {
    manifest = await getJSON('manifest.json');
  } catch (e) {
    fail('Could not load data bundle.', `Expected ${BASE}/manifest.json — ${e.message}`);
    return;
  }

  // Always show data age. Staleness must be visible, never assumed.
  const gen = new Date(manifest.generated_at);
  const el = document.getElementById('asof');
  if (isNaN(gen)) {
    el.textContent = 'data age unknown';
    el.className = 'stale';
  } else {
    el.textContent = `data as of ${gen.toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}`;
    if ((Date.now() - gen) / 36e5 > 36) el.className = 'stale';
  }
  document.getElementById('led').classList.toggle('stale', el.className === 'stale');

  // Only the changes feed loads up front. The bill index (~2.5 MB) is deferred to
  // the first search, which is the only thing that reads it — that is ~68% off
  // first paint. Detail files load on drill-in.
  // Scheduled hearings, shown above the feed. Absent or empty between sessions —
  // both fine, so a failure here must never block boot.
  const roles = ensureRoles();   // small; waited for below so names are coloured on first paint
  getJSON('upcoming.json').then(u => { upcoming = Array.isArray(u) ? u : [];
    if (currentTab === 'feed') render('feed'); renderAside(); }).catch(() => {});
  try {
    changes = await getJSON('changes.json');
  } catch (e) {
    // A blank page that still claims fresh data is the worst outcome for an
    // alerting tool, so say plainly that the feed is missing.
    fail('Activity feed unavailable.', e.message);
    updateWatchCount();
    return;
  }
  await roles;
  updateWatchCount();
  renderAside();
  // Boot from the URL, not unconditionally to the home screen: a link someone sends
  // you must land on what it points at. applyRoute() falls back to the watchlist when
  // there is no route.
  restoreViews();
  applyRoute();
  hideSplash();
  ensureMe();      // roles for the menu, the To Do list, the server-side watchlist
}

// ── watchlist ───────────────────────────────────────────────────────
// Two sources, one list. `watch` is the stars tapped on THIS device (localStorage, as
// always). `serverWatch` is the bills this PERSON follows in the database - which is
// how "Plan for Floor" puts a bill on a chair's watchlist from someone else's desk.
// Adding with the star stays local (no API run); removing takes it out of both.
let me = null;                      // the whoami answer: roles, committees, tasks, follows
let serverWatch = new Set();
const isWatched = k => watch.has(k) || serverWatch.has(k);
const watchedKeys = () => new Set([...watch, ...serverWatch]);
function toggleWatch(k, ev){
  ev?.stopPropagation();
  if (isWatched(k)){
    watch.delete(k);
    if (serverWatch.has(k)){
      serverWatch.delete(k);
      apiCall('unfollow', {subject_type: 'bill', subject_key: k}).then(r => {
        if (r && r.ok && me){ me.follows = r.data; cacheMe(); }
      });
    }
  } else watch.add(k);
  save(LS.watch, [...watch]);
  updateWatchCount();
  render(currentTab);
  renderAside();
  // The list was just redrawn, so find the star again and let it pop.
  const star = view.querySelector(`.star[data-watch="${CSS.escape(k)}"]`);
  if (star) star.classList.add('pop');
}

// ── who is signed in (the live side's whoami) ───────────────────────
// One API run, kept for ten minutes in sessionStorage so moving between the two pages
// does not spend another. It decides which menu entries are shown, brings the To Do
// list (what this person owes) and the bills the database has on their watchlist.
// Nothing here is a permission: every action is checked again by api_call().
const ME_KEY = 'skywalker.me.v1';
function cacheMe(){
  try { sessionStorage.setItem(ME_KEY, JSON.stringify({t: Date.now(), v: access.verifier.slice(0, 12), data: me})); } catch {}
}
function onMe(){
  serverWatch = new Set(((me && me.follows) || []).filter(f => f.subject_type === 'bill').map(f => f.subject_key));
  const tasks = (me && me.tasks) || [];
  Skywalker.buildTray({nav: document.getElementById('tabs'), page: 'index', who: me || {tier: access ? access.tier : null},
                       active: trayOf(currentTab), badges: {home: tasks.length}});
  updateWatchCount();
  if (currentTab === 'watch') render('watch'); else showTodoCard();
}
async function ensureMe(force){
  if (!access) return null;
  let c = null;
  try { c = JSON.parse(sessionStorage.getItem(ME_KEY) || 'null'); } catch {}
  const mine = c && c.v === access.verifier.slice(0, 12) && c.data;
  if (mine && !me){ me = c.data; onMe(); }
  if (!force && mine && Date.now() - c.t < 10 * 60 * 1000) return me;
  const r = await apiCall('whoami');
  if (r && r.ok){ me = r.data; cacheMe(); onMe(); }
  return me;
}

// Changes newer than the last timestamp this device saw for that bill.
function unseenFor(k){
  const [b, n] = k.split('|');
  const last = seen[k];
  return changes.filter(c => c.biennium === b && c.bill_no === n && (!last || c.t > last));
}
function markSeen(k){
  const items = unseenFor(k);
  if (items.length){ seen[k] = items[0].t; save(LS.seen, seen); }
}

function billCard(b, opts = {}){
  const k = key(b);
  const on = isWatched(k);
  const unseen = opts.showNew ? unseenFor(k).length : 0;
  const sp = (b.sp || []).map((nm, i) => sponsorHTML(nm, (b.si || [])[i]));
  // The tile: an icon square in the stage's colour (with the 3DS green dot when the
  // bill has changed since it was last opened), then the words, then the star - or,
  // while the watchlist is being edited, a Remove button in its place.
  // The biennium is said only when the list mixes bienniums ("All"), and as 2025–26,
  // not as the database's own code.
  return `<div class="card row${stageCls(b.g)}${hueCls(b.g, b.c)}"${stageAttr(b.g)}${hueAttr(b.g, b.c)} data-open="${esc(k)}" role="button" tabindex="0"
    aria-label="Open ${esc(b.n)}">
    <span class="ico"><svg class="i"><use href="#i-bill"/></svg>${unseen ? '<i class="dot"></i>' : ''}</span>
    <div class="grow">
      ${billNo(b.n)}
      ${unseen ? `<span class="pill warn">${unseen} new</span>` : ''}
      ${annotBadge('bill', {biennium: b.b, bill_no: b.n})}
      <div class="title">${esc(b.t || b.l || '')}</div>
      <div class="meta">
        ${stageChip(b.g)}
        ${b.g === 'committee' && b.c ? cmChip(b.c) : ''}
        <span class="pill">${esc(b.s || 'Status unknown')}</span>
        ${sp.length ? `<span>${sp.slice(0,2).join(' ')}${sp.length>2?' +'+(sp.length-2):''}</span>` : ''}
        ${billView.bi === 'all' ? `<span class="pill">${esc(biLabel(b.b))}</span>` : ''}
      </div>
    </div>
    ${opts.edit ? `<button class="pill bad" data-watch="${esc(k)}" style="align-self:center">Remove</button>`
      : `<button class="star ${on?'on':''}" data-watch="${esc(k)}" aria-label="${on?'Remove from watchlist':'Add to watchlist'}">${on?'★':'☆'}</button>`}
  </div>`;
}

// ── the activity feed: one string, drawn as the Activity tab AND as the banner ──
function feedGroups(){
  // End-of-session floods the feed with hundreds of identical bulk actions
  // ("Died on Calendar" x60), which made the landing screen a wall of one repeated
  // row. Collapse consecutive identical actions into a single expandable line so
  // the feed shows distinct EVENTS rather than distinct bills.
  const groups = [];
  for (const c of changes.slice(0, 400)){
    const key = `${c.kind}|${c.label}|${(c.t||'').slice(0,16)}`;
    const last = groups[groups.length-1];
    if (last && last.key === key) last.items.push(c);
    else groups.push({ key, label: c.label, kind: c.kind, t: c.t, items: [c] });
    if (groups.length >= 60) break;
  }
  return groups;
}
function recentHTML(){
  const groups = feedGroups();
  // Every bill number in a grouped row is a real link. These groups used to render
  // the numbers as flat text, so the landing page NAMED dozens of bills that could
  // not be opened from where they were named.
  const chip = (c) => c.bill_no
    ? `<a class="bn${stageCls(c.stage)} ${bnCls(c.bill_no)}"${stageAttr(c.stage)} data-hover="bill" data-bi="${esc(c.biennium)}" data-bn="${esc(c.bill_no)}" href="#/bill/${encodeURIComponent(c.biennium)}/${encodeURIComponent(c.bill_no)}">${esc(c.bill_no)}</a>` : '';
  return upcomingHTML() +
    `<h2>Recent activity</h2>` + (groups.length ? groups.map(g => {
    if (g.items.length === 1) return tickHTML(g.items[0]);
    const bills = g.items.filter(c => c.bill_no);
    // One stripe for the group when every bill in it is at the same stage.
    const gs = g.items.every(c => c.stage && c.stage === g.items[0].stage) ? g.items[0].stage : null;
    return `<div class="tick${stageCls(gs)}"${stageAttr(gs)}>
      <b>${g.items.length} bills</b> ${esc(g.label || g.kind)}
      <div>${new Date(g.t).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}
        — ${bills.slice(0,8).map(chip).join(', ')}${bills.length>8?` +${bills.length-8} more`:''}</div>
    </div>`;
  }).join('') : `<div class="card empty">No recent activity.</div>`);
}

// "What's scheduled" sits above "what happened" — during session it is the
// most-consulted screen in the office; between sessions it renders nothing.
function upcomingHTML(){
  if (!upcoming.length) return '';
  const chip = (u, bn) =>
    `<a class="bn ${bnCls(bn)}" data-hover="bill" data-bi="${esc(u.biennium)}" data-bn="${esc(bn)}" href="#/bill/${encodeURIComponent(u.biennium)}/${encodeURIComponent(bn)}">${esc(bn)}</a>`;
  return `<h2>Coming up</h2>` + upcoming.slice(0, 20).map(u => `
    <div class="tick${u.committee ? ' hue' : ''}"${u.committee ? ` style="--h:${cmHue(u.committee)}"` : ''}>
      <b>${u.t ? new Date(u.t).toLocaleString([], {weekday:'short', month:'short',
          day:'numeric', hour:'numeric', minute:'2-digit'}) : 'TBD'}</b>
      ${cmChip(u.committee)}${u.room ? ` — ${esc(u.room)}` : ''}
      <div>${(u.bills || []).map(bn => chip(u, bn)).join(', ') || 'Agenda not posted'}</div>
    </div>`).join('');
}

// One feed row. 'NEW' means UNSEEN, not merely watched — labelling every watched
// bill NEW forever just teaches people to ignore the badge.
function tickHTML(c){
  const k = `${c.biennium}|${c.bill_no}`;
  const isNew = isWatched(k) && unseenFor(k).length > 0;
  const mark = TICK_MARK[c.kind];
  // `t` is when the system LEARNED of it; `happened` is when it happened. The title
  // says both, because "why is a three-day-old hearing at the top?" is a fair question.
  const when = new Date(c.t);
  const title = 'Learned ' + when.toLocaleString()
    + (c.happened ? ' · Happened ' + new Date(c.happened).toLocaleString() : '');
  return `<div class="tick ${isNew ? 'new' : ''}${stageCls(c.stage)}${hueCls(c.stage, c.c)}"${stageAttr(c.stage)}${hueAttr(c.stage, c.c)} ${c.bill_no ? `data-open="${esc(k)}"` : ''}>
    <b>${c.bill_no ? billNo(c.bill_no, c.biennium) : '—'}</b> ${c.bill_no ? stageChip(c.stage) + ' ' : ''}${c.stage === 'committee' && c.c ? cmChip(c.c) + ' ' : ''}${mark ? `<span class="pill">${esc(mark)}</span> ` : ''}${esc(c.label || c.kind || '')}
    ${c.tally && c.tally.yea != null ? ` <span class="pill">${esc(c.tally.yea)}–${esc(c.tally.nay)}</span>` : ''}
    <div title="${esc(title)}">${isNaN(when) ? '' : when.toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</div>
  </div>`;
}

// The banner down the right of wide screens (CSS shows it from 1000px; below that
// the Activity tab shows the same thing). Sixty rows, cheap to redraw, so it is
// redrawn whenever what it shows could have changed: the feed arriving, a watch
// toggled, a bill opened (which clears its NEW).
function renderAside(){
  const a = document.getElementById('aside');
  if (!changes.length && !upcoming.length) return;
  a.innerHTML = `<div class="aside-head"><i class="${document.getElementById('led').className}"></i>Activity</div>` +
    feedToggleHTML(asideMode, 'aside') + (asideMode === 'go' ? generalOrdersHTML() : recentHTML());
}

// ── the bill bar: biennium (latest by default), chamber, where it is, sort ──
const billView = {bi: null, chamber: 'all', stage: 'all', sort: 'match'};
const STAGE_ORDER = {introduced: 0, committee: 1, floor: 2, governor: 3, law: 4, dead: 5};
const billNum = n => { const m = /^([A-Z]+)\s*(\d+)/i.exec(String(n || '')); return m ? [m[1].toUpperCase(), parseInt(m[2], 10)] : ['', 0]; };
function billBienniums(){ return [...new Set((billIndex || []).map(b => b.b))].sort().reverse(); }
function filterBills(list){
  const bis = billBienniums();
  if (!bis.includes(billView.bi) && billView.bi !== 'all') billView.bi = bis[0] || 'all';
  return list.filter(b => (billView.bi === 'all' || b.b === billView.bi)
    && (billView.chamber === 'all' || bnCls(b.n) === billView.chamber)
    && (billView.stage === 'all' || b.g === billView.stage));
}
function sortBills(list, searching){
  const byNo = (a, b) => { const [ca, na] = billNum(a.n), [cb, nb] = billNum(b.n); return ca.localeCompare(cb) || na - nb || String(a.b).localeCompare(String(b.b)); };
  if (billView.sort === 'number' || (billView.sort === 'match' && !searching)) return [...list].sort(byNo);
  if (billView.sort === 'stage') return [...list].sort((a, b) => (STAGE_ORDER[a.g] ?? 9) - (STAGE_ORDER[b.g] ?? 9) || byNo(a, b));
  return list;
}
function billBarHTML(searching){
  return `<div class="fbar">
    ${fbarGroup('Biennium', 'bv-bi', [...billBienniums().map(b => [b, biLabel(b)]), ['all', 'All']], billView.bi)}
    ${fbarGroup('Chamber', 'bv-chamber', [['all', 'Both'], ['H', 'House'], ['S', 'Senate']], billView.chamber)}
    ${fbarGroup('Where', 'bv-stage', [['all', 'Anywhere'], ['committee', 'In committee'], ['floor', 'On the floor'], ['governor', 'Governor'], ['law', 'Law'], ['dead', 'Dead']], billView.stage)}
    ${fbarGroup('Sort', 'bv-sort', [...(searching ? [['match', 'Best match']] : []), ['number', 'Number'], ['stage', 'Where it is']], billView.sort === 'match' && !searching ? 'number' : billView.sort)}
  </div>`;
}

// ── like a browser: every tab remembers where you were ──────────────
// Leave a screen and come back and it is as you left it: the same scroll position, the
// same text in the box, the same filters, the same part of a combined screen. Kept in
// sessionStorage, so it also survives a trip to the leadership page and back.
// render() is the door: it notes the screen being left, restores the one being opened,
// and hands the painting to draw(). Redrawing the SAME screen (a filter, a file
// arriving) goes through the same door and changes nothing about the place.
const TABMEM_KEY = 'skywalker.tabmem.v1';
const tabMem = (() => { try { return JSON.parse(sessionStorage.getItem(TABMEM_KEY)) || {}; } catch { return {}; } })();
let wantScroll = null;
let bpTab = 'search', peopleTab = 'members';   // which part of Bills & People was open last
let asideMode = 'recent';                      // the banner's own switch: recent | go
let watchMode = 'mine', watchEdit = false;     // the watchlist: mine | board (leadership)
const trayOf = tab => ({members: 'search', orgs: 'search', notes: 'search', stats: 'search', hearings: 'feed'})[tab] || tab;
function rememberTab(){
  if (lastTab) tabMem[lastTab] = {y: Math.round(scrollY), q: document.getElementById('q').value};
  tabMem._views = {billView, memberView, feedMode, asideMode, orgGroup, bpTab, peopleTab, watchMode, calMode,
                   calMonth: cal.month ? cal.month.toISOString() : null};
  try { sessionStorage.setItem(TABMEM_KEY, JSON.stringify(tabMem)); } catch {}
}
addEventListener('pagehide', rememberTab);
function restoreViews(){
  const v = tabMem._views;
  if (!v) return;
  if (v.billView) Object.assign(billView, v.billView);
  if (v.memberView) Object.assign(memberView, v.memberView);
  if (['recent', 'go', 'hearings'].includes(v.feedMode)) feedMode = v.feedMode;
  if (['recent', 'go'].includes(v.asideMode)) asideMode = v.asideMode;
  if (v.orgGroup) orgGroup = v.orgGroup;
  if (['search', 'members', 'orgs'].includes(v.bpTab)) bpTab = v.bpTab;
  if (['members', 'orgs'].includes(v.peopleTab)) peopleTab = v.peopleTab;
  if (['mine', 'board'].includes(v.watchMode)) watchMode = v.watchMode;
  if (['days', 'plans', 'decisions'].includes(v.calMode)) calMode = v.calMode;
  if (v.calMonth){ const d = new Date(v.calMonth); if (!isNaN(d)) cal.month = d; }
}
function render(tab, opts = {}){
  const qEl = document.getElementById('q');
  if (tab !== lastTab){
    rememberTab();
    const m = tabMem[tab];
    qEl.value = opts.q != null ? opts.q : ((m && m.q) || '');
    wantScroll = opts.q != null ? 0 : ((m && m.y) || 0);
  } else if (opts.q != null) qEl.value = opts.q;
  const term = qEl.value.trim().toLowerCase();
  if (tab === 'members') memberFilter = term;
  if (tab === 'orgs') orgFilter = term;
  if (tab === 'feed' && feedMode === 'hearings') hearingFilter = term;
  if (tab === 'search' || tab === 'members' || tab === 'orgs') bpTab = tab;
  if (tab === 'members' || tab === 'orgs') peopleTab = tab;
  draw(tab);
  // Back to where they were - once the real content is up, not over the loading shapes.
  if (wantScroll != null && !pendingFresh){
    const y = wantScroll; wantScroll = null;
    requestAnimationFrame(() => scrollTo(0, y));
  }
}

// ── Bills & People: one screen, a two-button switch at the top ──────
// Bills, and People (members and organizations). Notes used to be a tab of its own; it
// is the "My notes" button here, and a note or tag is added from the bill or the
// person it is about.
function bpBarHTML(){
  const people = currentTab === 'members' || currentTab === 'orgs';
  const n = Object.keys(annot).length;
  return `<div class="bpbar"><span></span>
      <div class="subnav big"><button data-bp="search" class="${!people && currentTab !== 'notes' ? 'on' : ''}">Bills</button>
        <button data-bp="people" class="${people ? 'on' : ''}">People</button></div>
      <button class="pill${currentTab === 'notes' ? ' on' : ''}" data-bp="notes">My notes${n ? ' · ' + n : ''}</button></div>` +
    (people ? `<div class="subnav" style="margin:0 auto 10px"><button data-bp="members" class="${currentTab === 'members' ? 'on' : ''}">Members</button>
      <button data-bp="orgs" class="${currentTab === 'orgs' ? 'on' : ''}">Organizations</button></div>` : '');
}

// ── the leadership board, as a watchlist option ─────────────────────
// The bills leadership is tracking for a reason - flagged, a brief owed, a whip count
// open, a chairman's plan moving, in the drawer - as tiles like any other list. It
// used to be a screen of its own on the leadership page (asked 2026-10-01 to fold it
// in here). api_call() answers `board` to leadership only.
const PLAN_LABELS = {
  no_current_plan: 'No current plan', planning_hearing: 'Planning a hearing',
  hearing_scheduled: 'Hearing scheduled', planning_to_work: 'Planning to work it',
  working_amendments: 'Working amendments', waiting_on_information: 'Waiting on information',
  possible_action: 'Possible action', final_action_planned: 'Final action planned',
  holding: 'Holding', in_the_drawer: 'In the drawer'
};
const board = {rows: null, loading: false, error: ''};
async function loadBoard(){
  board.loading = true; board.error = '';
  const r = await apiCall('board', {});
  board.loading = false;
  if (r && r.ok){
    const byBill = new Map();
    const add = (rows, tag) => (rows || []).forEach(x => {
      const cur = byBill.get(x.bill_no) || {tags: []};
      Object.entries(x).forEach(([k, v]) => { if (v != null && cur[k] == null) cur[k] = v; });
      if (!cur.tags.includes(tag)) cur.tags.push(tag);
      byBill.set(x.bill_no, cur);
    });
    // The order of these is the order of the list: what needs a decision first.
    add(r.data.attention, 'Attention'); add(r.data.briefs_outstanding, 'Brief due');
    add(r.data.whip_active, 'Whip'); add(r.data.moving, 'Moving'); add(r.data.drawer, 'Drawer');
    board.rows = [...byBill.values()];
  } else board.error = (r && r.error === 'leadership only') ? 'The board is for leadership.' : 'Could not load the board.';
  if (currentTab === 'watch' && watchMode === 'board') render('watch');
}
function boardTile(r){
  const b = billIndex ? billIndex.find(x => x.b === r.biennium && x.n === r.bill_no) : null;
  const stage = r.stage || (b && b.g), k = `${r.biennium}|${r.bill_no}`, on = isWatched(k);
  const pills = [];
  if (r.tags.includes('Attention')) pills.push('<span class="pill bad">Needs attention</span>');
  if (r.tags.includes('Brief due')) pills.push(`<span class="pill warn">Brief due${r.brief_status ? ' · ' + esc(cap(String(r.brief_status).replace(/_/g, ' '))) : ''}</span>`);
  if (r.whip_updated_at) pills.push(`<span class="pill">Whip: ${(r.yes || 0) + (r.lean_yes || 0)} yes · ${(r.no || 0) + (r.lean_no || 0)} no · ${r.undecided || 0} undecided</span>`);
  if (r.chair_plan) pills.push(`<span class="pill">${esc(PLAN_LABELS[r.chair_plan] || cap(String(r.chair_plan).replace(/_/g, ' ')))}</span>`);
  if (r.deadline) pills.push(`<span class="pill warn">Deadline ${esc(r.deadline)}</span>`);
  return `<div class="card row${stageCls(stage)}"${stageAttr(stage)} data-open="${esc(k)}" role="button" tabindex="0" aria-label="Open ${esc(r.bill_no)}">
    <span class="ico"><svg class="i"><use href="#i-bill"/></svg></span>
    <div class="grow">${billNo(r.bill_no)}
      <div class="title">${esc(r.short_title || (b && (b.t || b.l)) || '')}</div>
      <div class="meta">${stageChip(stage)} ${r.committee ? cmChip(r.committee) : ''} ${pills.join(' ')}</div></div>
    <button class="star ${on ? 'on' : ''}" data-watch="${esc(k)}" aria-label="${on ? 'Remove from watchlist' : 'Add to watchlist'}">${on ? '★' : '☆'}</button></div>`;
}

function drawWatch(){
  const lead = !!(me && me.is_leadership);
  const modeBar = lead ? `<div class="subnav" style="margin:0 0 10px">
      <button data-watchmode="mine" class="${watchMode !== 'board' ? 'on' : ''}">My watchlist</button>
      <button data-watchmode="board" class="${watchMode === 'board' ? 'on' : ''}">Leadership board</button></div>` : '';
  if (lead && watchMode === 'board'){
    if (!board.rows && !board.loading && !board.error) loadBoard();
    if (!board.rows){
      view.innerHTML = modeBar + (board.error ? `<div class="bubble" style="margin-top:8px"><b>${esc(board.error)}</b></div>` : skeletonHTML(4));
      return;
    }
    if (!billIndex) ensureBillIndex().then(() => { if (currentTab === 'watch' && watchMode === 'board') render('watch'); }).catch(() => {});
    view.innerHTML = modeBar + tasksHTML() +
      `<div class="count">${board.rows.length} bill${board.rows.length === 1 ? '' : 's'} leadership is tracking
        <button class="tagx" data-boardrefresh="1" style="color:var(--accent);text-transform:none;letter-spacing:0">Refresh</button></div>` +
      (board.rows.length ? `<div class="tiles">${board.rows.map(boardTile).join('')}</div>`
        : `<div class="bubble" style="margin-top:8px"><b>Nothing on the board yet.</b>A bill appears here when it is flagged, a brief is owed, a whip count is open or a chairman has a plan for it.</div>`);
    return;
  }
  const keys = watchedKeys();
  if (!keys.size){
    // The empty home screen: the bubble and the empty slot, as the 3DS shows them
    // when there is no game card.
    view.innerHTML = modeBar + tasksHTML() + `
      <div class="bubble"><b>Nothing on your watchlist yet.</b>
        Tap ☆ on any bill to follow it here. Your list stays on this device.</div>
      <div class="slot" aria-hidden="true">☆</div>
      <div class="slot-actions">
        <a class="btn primary" href="#/search"><svg class="i"><use href="#i-bill"/></svg> Browse bills</a>
        <a class="btn" href="#/feed"><svg class="i"><use href="#i-pulse"/></svg> See what changed</a>
      </div>`;
    return;
  }
  // The watchlist needs the index to resolve keys to bills.
  if (!billIndex){
    view.innerHTML = modeBar + skeletonHTML(4); pendingFresh = true;
    ensureBillIndex().then(() => render('watch'))
      .catch(e => fail('Could not load bill index.', e.message));
    return;
  }
  const all = billIndex.filter(b => keys.has(key(b)));
  const mine = sortBills(filterBills(all));
  const withNews = mine.filter(b => unseenFor(key(b)).length);
  // A watched key with no matching bill (dropped from the index, or an older
  // biennium) previously left a permanent dead entry with no way to clear it.
  const known = new Set(all.map(b => key(b)));
  const orphans = [...keys].filter(k => !known.has(k));
  const rest = mine.filter(b => !withNews.includes(b));
  // Removing: the star on any tile takes a bill off; "Remove…" turns every star into a
  // plain Remove button and offers "Remove all shown" for clearing a filtered list.
  const tools = `<span style="margin-left:auto;display:flex;gap:6px">
      ${watchEdit && mine.length ? `<button class="pill bad" data-watchedit="all">Remove all shown</button>` : ''}
      <button class="pill${watchEdit ? ' on' : ''}" data-watchedit="toggle">${watchEdit ? 'Done' : 'Remove…'}</button></span>`;
  view.innerHTML = modeBar + billBarHTML(false) + tasksHTML() +
    (!mine.length ? `<div class="bubble"><b>Nothing here with these choices.</b>Try another biennium, chamber or stage above.</div>` : '') +
    (withNews.length ? `<h2>Changed since you last looked${rest.length ? '' : tools}</h2><div class="tiles">` +
      withNews.map(b => billCard(b, {showNew: true, edit: watchEdit})).join('') + `</div>` : '') +
    (rest.length ? `<h2>Tracking (${mine.length})${tools}</h2><div class="tiles">` +
      rest.map(b => billCard(b, {edit: watchEdit})).join('') + `</div>` : '') +
    (orphans.length ? `<h2>No longer available (${orphans.length})</h2><div class="tiles">` + orphans.map(k => `
      <div class="card row"><span class="ico"><svg class="i"><use href="#i-bill"/></svg></span>
      <div class="grow">${billNo(k.split('|')[1], k.split('|')[0])}
      <div class="meta">Not in the current data — may be from an earlier biennium</div></div>
      <button class="pill bad" data-watch="${esc(k)}" style="align-self:center">Remove</button></div>`).join('') + `</div>` : '');
}

function draw(tab){
  currentTab = tab;
  hideHover();
  document.getElementById('exportfab').hidden = tab !== 'notes';
  // Tiles slide in when the SCREEN changes (a tab, or a list arriving), never on a
  // keystroke in the search box: that redraws the same screen and must hold still.
  view.classList.toggle('arrive', tab !== lastTab || pendingFresh);
  lastTab = tab; pendingFresh = false;
  Skywalker.setActive(document.getElementById('tabs'), trayOf(tab));
  showTodoCard();
  // The box FILTERS people, organizations and hearings and SEARCHES bills elsewhere.
  document.getElementById('q').placeholder =
    tab === 'members' ? 'Filter members…' :
    tab === 'orgs'    ? 'Filter organizations…' :
    (tab === 'feed' && feedMode === 'hearings') ? 'Filter by committee or bill…' :
    'Search bills, sponsors, topics…';

  if (tab === 'notes') return renderNotes();
  if (tab === 'calendar') return renderCalendar();

  if (tab === 'orgs'){
    if (!orgIndex){
      view.innerHTML = bpBarHTML() + skeletonHTML(6); pendingFresh = true;
      ensureOrgs().then(() => { if (currentTab === 'orgs') render('orgs'); })
        .catch(e => fail('Could not load organizations.', e.message));
      return;
    }
    return renderOrgs();
  }

  if (tab === 'members' || tab === 'stats'){
    if (!members){
      view.innerHTML = bpBarHTML() + skeletonHTML(6); pendingFresh = true;
      ensureAnalytics().then(() => { if (currentTab === tab) render(tab); })
        .catch(e => fail('Could not load analytics.', e.message));
      return;
    }
    return tab === 'members' ? renderMembers() : renderStats();
  }

  // Activity: what has happened, what is coming to the floor, and the hearings.
  if (tab === 'feed'){
    const top = feedToggleHTML(feedMode, 'main');
    if (feedMode === 'hearings'){
      if (!testimonyAll){
        view.innerHTML = top + skeletonHTML(6); pendingFresh = true;
        ensureHearings().then(() => { if (currentTab === 'feed' && feedMode === 'hearings') render('feed'); })
          .catch(e => fail('Could not load hearings.', e.message));
        return;
      }
      view.innerHTML = top + hearingsHTML();
      return;
    }
    view.innerHTML = top + (feedMode === 'go' ? generalOrdersHTML() : recentHTML());
    return;
  }

  if (tab === 'watch') return drawWatch();

  // Bills: every bill of the chosen biennium (the bar narrows and sorts it), or the
  // search hits when something is typed in the box at the top.
  const q = document.getElementById('q').value.trim();
  if (!billIndex){
    view.innerHTML = bpBarHTML() + skeletonHTML(4); pendingFresh = true;
    ensureBillIndex().then(() => { if (currentTab === 'search') render('search'); })
      .catch(e => fail('Could not load the bill index.', e.message));
    return;
  }
  if (!q){
    const list = sortBills(filterBills(billIndex));
    view.innerHTML = bpBarHTML() + billBarHTML(false) +
      `<div class="count">${list.length.toLocaleString()} bill${list.length === 1 ? '' : 's'}${
        billView.bi !== 'all' ? ' · ' + esc(biLabel(billView.bi)) : ''}</div>` +
      (list.length ? `<div class="tiles">${list.slice(0, 120).map(b => billCard(b)).join('')}</div>` +
        (list.length > 120 ? `<div class="count">Showing the first 120 · type in the box at the top to narrow the list</div>` : '')
      : `<div class="bubble"><b>No bills here with these choices.</b>Try another biennium, chamber or stage above.</div>`);
    return;
  }
  const hits = sortBills(filterBills(searchBills(q)), true);
  view.innerHTML = bpBarHTML() + billBarHTML(true) + `<div class="count">${hits.length.toLocaleString()} result${hits.length===1?'':'s'}</div>`
    + (hits.length ? `<div class="tiles">${hits.slice(0,120).map(b => billCard(b)).join('')}</div>`
                   : `<div class="bubble"><b>Nothing matched “${esc(q)}”.</b>Try a bill number, a word from the title, or a sponsor.</div>`);
}

// Bill numbers arrive in many shapes — "hb 2596", "HB2596", "2596".
// Normalizing both sides makes all of them work.
function searchBills(q){
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const nq = norm(q), words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored = [];
  for (const b of billIndex){
    const nn = norm(b.n);
    let score = 0;
    if (nn === nq) score = 100;
    else if (nq && nn.includes(nq)) score = 60;
    else {
      const hay = `${b.t || ''} ${b.l || ''} ${(b.sp || []).join(' ')}`.toLowerCase();
      if (words.every(w => hay.includes(w))) score = 20;
    }
    if (score) scored.push([score, b]);
  }
  return scored.sort((a, b) => b[0] - a[0]).map(x => x[1]);
}

// ── members ─────────────────────────────────────────────────────────
// 224,756 per-member votes and the coalition analytics existed as files nothing
// could reach. These two views are the whole point of having parsed the journals.
let memberFilter = '';
// The Members tab: everyone with a seat in the chosen biennium (the roster files), with
// their voting record from the analytics where there is one. The bar at the top picks
// biennium (latest by default), chamber, party, committee and the sort.
const memberView = {bi: null, chamber: 'all', party: 'all', cmt: 'all', sort: 'name', former: 'no'};
const lastName = n => { const w = String(n || '').trim().split(/\s+/); return (w[w.length - 1] || '') + ' ' + w[0]; };
// One compact chip per choice: the label and a drop-down, so a whole bar is one line on
// a desktop and two on a phone (it was four rows of buttons until 2026-10-01).
function fbarGroup(label, attr, options, current){
  return `<label class="fsel"><span>${label}</span><select data-fv="${attr}">${options.map(([v, l]) =>
    `<option value="${esc(v)}" ${String(v) === String(current) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
}
function renderMembers(){
  const bienniums = [...new Set(legsAll.map(l => l.biennium))].sort().reverse();
  const bi = bienniums.includes(memberView.bi) ? memberView.bi : (bienniums[0] || curBi);
  memberView.bi = bi;
  // Committee roles for THIS biennium (personInfo only knows the latest one).
  const roleByKpid = {}, sitsByKpid = {};
  const cmtsHere = cmtsAll.filter(c => c.biennium === bi);
  for (const c of cmtsHere) for (const m of roster(c)){
    (sitsByKpid[m.kpid] ||= []).push(c);
    if (m.role !== 'member' && (!roleByKpid[m.kpid] || m.role === 'chair'))
      roleByKpid[m.kpid] = (m.role === 'chair' ? 'Chair of ' : 'Vice chair of ') + (c.title || c.display_name || '');
  }
  const leadByKpid = {};
  for (const l of leadsAll) if (l.biennium === bi && l.title) leadByKpid[l.member_kpid] = l.title;
  const statsOf = {};
  for (const m of (members || [])) if (m.biennium === bi) statsOf[String(m.person_id)] = m;

  // One row per person: an Active seat beats an inactive one.
  const seen = {};
  for (const l of legsAll){
    if (l.biennium !== bi) continue;
    const k = String(l.person_id);
    if (!seen[k] || (l.status === 'Active' && seen[k].status !== 'Active')) seen[k] = l;
  }
  let rows = Object.values(seen).map(l => ({
    l, pid: String(l.person_id), name: l.full_name || '', chamber: cap(l.chamber), party: l.party || '',
    district: l.district || '', role: leadByKpid[l.kpid] || roleByKpid[l.kpid] || '',
    sits: sitsByKpid[l.kpid] || [], stats: statsOf[String(l.person_id)],
  }));
  // Current seats only, unless asked: a biennium's roster also lists everyone who
  // resigned or was replaced (471 rows for 165 seats in 2025-26).
  if (memberView.former !== 'yes') rows = rows.filter(r => !r.l.status || r.l.status === 'Active');
  if (memberView.chamber !== 'all') rows = rows.filter(r => r.chamber.toLowerCase() === memberView.chamber);
  if (memberView.party !== 'all') rows = rows.filter(r => r.party.toLowerCase().startsWith(memberView.party));
  if (memberView.cmt !== 'all') rows = rows.filter(r => r.sits.some(c => c.kpid === memberView.cmt));
  if (memberFilter) rows = rows.filter(r => r.name.toLowerCase().includes(memberFilter));
  rows.sort(memberView.sort === 'district'
    ? (a, b) => a.chamber.localeCompare(b.chamber) || (parseInt(a.district, 10) || 999) - (parseInt(b.district, 10) || 999) || lastName(a.name).localeCompare(lastName(b.name))
    : (a, b) => lastName(a.name).localeCompare(lastName(b.name)));

  const cmtOptions = cmtsHere
    .filter(c => memberView.chamber === 'all' || String(c.chamber).toLowerCase() === memberView.chamber || c.chamber === 'Both')
    .sort((a, b) => cmName(a).localeCompare(cmName(b)));
  const initials = n => String(n || '').split(/\s+/).filter(Boolean).filter((w, i, arr) => i === 0 || i === arr.length - 1).map(w => w[0]).join('').toUpperCase();
  const ptyLetter = p => /^r/i.test(p) ? 'R' : /^d/i.test(p) ? 'D' : '';
  const bar = `<div class="fbar">
    ${fbarGroup('Biennium', 'mv-bi', bienniums.map(b => [b, biLabel(b)]), bi)}
    ${fbarGroup('Chamber', 'mv-chamber', [['all', 'Both'], ['house', 'House'], ['senate', 'Senate']], memberView.chamber)}
    ${fbarGroup('Party', 'mv-party', [['all', 'All'], ['republican', 'Republican'], ['democrat', 'Democrat']], memberView.party)}
    ${fbarGroup('Committee', 'mv-cmt', [['all', 'All committees'], ...cmtOptions.map(c => [c.kpid, cmName(c)])], memberView.cmt)}
    ${fbarGroup('Sort', 'mv-sort', [['name', 'Name'], ['district', 'District']], memberView.sort)}
    ${fbarGroup('Former members', 'mv-former', [['no', 'Hide'], ['yes', 'Show']], memberView.former)}
  </div>`;
  view.innerHTML = bpBarHTML() + bar +
    `<div class="count">${rows.length} member${rows.length === 1 ? '' : 's'} · ${esc(biLabel(bi))}${
      memberView.chamber !== 'all' ? ' · ' + cap(memberView.chamber) : ''}</div><div class="tiles">` +
    rows.map(r => {
      const s = r.stats;
      const now = r.sits.map(c => [c, meetingNow(c.kpid)]).find(x => x[1]);
      const line2 = [r.district ? `District ${esc(r.district)}` : '',
        s ? `${s.roll_calls} roll calls` : 'No roll calls yet',
        s && s.party_unity_pct != null ? `Party unity ${s.party_unity_pct}%` : ''].filter(Boolean).join(' · ');
      return `
      <div class="card row mtile" data-member="${esc(r.pid)}" role="button" tabindex="0" aria-label="Open ${esc(r.name)}">
        <span class="ico txt ${ptyLetter(r.party)}">${esc(initials(r.name))}</span>
        <div class="grow">
          <div class="mname">${nameChip(r.name, r.pid, ptyLetter(r.party))}${r.l.status && r.l.status !== 'Active' ? ' <span class="pill">Inactive</span>' : ''}</div>
          <div class="mline"><span class="pty ${ptyLetter(r.party)}">${esc(ptyLetter(r.party) || '?')}</span> ${esc(r.party || 'No party')} · ${esc(r.chamber)} · ${esc(r.role || 'Member')}</div>
          <div class="mline meta">${line2}</div>
          ${now ? nowBox(now[0], now[1]) : ''}
        </div>
      </div>`; }).join('') + `</div>`;
}

// ── organizations ───────────────────────────────────────────────────
// Two different kinds of claim live here and are deliberately NOT merged:
//   APPEARANCES — fact. This organization testified on this bill with this stance.
//   POSITIONS   — the office's judgement about where they stand. Set in Retool.
// Testimony is evidence toward a position; it is not a position.
let orgFilter = '';
function renderOrgs(){
  // Default to stakeholders. Unfiltered, this list is topped by the Office of the
  // Revisor of Statutes under several spellings, then "State of Kansas", then the House
  // — the people who DRAFT the bills and the staff who explain them. They attend
  // constantly, which is not the same thing as lobbying, and letting them outrank the
  // Kansas Chamber makes the view answer a question nobody asked.
  const GROUPS = {
    stakeholders: {label: 'Stakeholders', test: o => o.t !== 'legislative_staff'},
    government:   {label: 'Government',   test: o => ['state_agency','local_government'].includes(o.t)},
    staff:        {label: 'Legislative staff', test: o => o.t === 'legislative_staff'},
    all:          {label: 'All',          test: () => true},
  };
  const g = GROUPS[orgGroup] ? orgGroup : 'stakeholders';
  const matching = orgIndex.filter(o =>
    GROUPS[g].test(o) && (!orgFilter || (o.n||'').toLowerCase().includes(orgFilter)));
  const rows = matching.slice(0, 200);
  const TYPE_LABEL = {
    legislative_staff: 'Legislative staff', state_agency: 'State agency',
    local_government: 'Local government', citizen: 'Individual',
  };
  view.innerHTML = bpBarHTML() +
    `<div class="subnav">${Object.entries(GROUPS).map(([k,v]) =>
      `<button data-orggroup="${k}" class="${k===g?'on':''}">${v.label}</button>`).join('')}</div>` +
    `<div class="count">${matching.length.toLocaleString()} of ${
      orgIndex.length.toLocaleString()} organizations${
      rows.length < matching.length ? ` · showing the ${rows.length} most active` : ''}</div>` +
    (rows.length ? `<div class="tiles">` + rows.map(o => `
      <div class="card row" data-org="${esc(o.id)}" role="button" tabindex="0"
           aria-label="Open ${esc(o.n)}">
        <span class="ico" style="--tint:#2f6b46"><svg class="i"><use href="#i-building"/></svg></span>
        <div class="grow">
          <strong>${esc(o.n)}</strong>
          <div class="meta"><span>${o.c} hearing appearance${o.c===1?'':'s'}</span>
            ${o.t?`<span class="pill">${esc(TYPE_LABEL[o.t] || cap(o.t))}</span>`:''}</div>
        </div>
      </div>`).join('') + `</div>`
      : `<div class="bubble"><b>No organizations match.</b>Try fewer letters, or another group above.</div>`);
}

// ── hearings ────────────────────────────────────────────────────────
function hearingsHTML(){
  // Groups come from TESTIMONY, not from the hearings table alone — a third of all
  // testimony belongs to budget hearings about agencies rather than bills, and this
  // grouping is the only way to reach it.
  const groups = new Map();
  for (const t of testimonyAll){
    if (!t.c || !t.d) continue;
    const k = `${t.c}|${t.d}`;
    if (!groups.has(k)) groups.set(k, {c: t.c, d: t.d, rows: [], bills: new Set()});
    const g = groups.get(k);
    g.rows.push(t);
    if (t.b) g.bills.add(t.b);
  }
  let list = [...groups.values()].sort((x, y) => (y.d || '').localeCompare(x.d || ''));
  if (hearingFilter){
    const f = hearingFilter;
    list = list.filter(g => cmtLabel(g.c).toLowerCase().includes(f)
      || g.c.toLowerCase().includes(f)
      || [...g.bills].some(bn => bn.toLowerCase().includes(f)));
  }
  const shown = list.slice(0, 120);
  return `<div class="count">${list.length.toLocaleString()} hearings with testimony on record${
      shown.length < list.length ? ` · showing the ${shown.length} most recent` : ''}</div>` +
    (shown.length ? `<div class="tiles">` + shown.map(g => {
      const dt = new Date(String(g.d) + 'T12:00:00'), okd = !isNaN(dt);
      return `
      <div class="card row" data-hearing="${esc(g.c)}|${esc(g.d)}" role="button" tabindex="0"
           aria-label="Open hearing">
        <span class="ico cal" style="--tint:#6a4c93"><b>${okd ? dt.getDate() : '?'}</b><small>${okd ? esc(dt.toLocaleDateString([], {month: 'short'})) : ''}</small></span>

          <strong>${cmChip(cmtLabel(g.c), {kpid: g.c})}</strong>
          <div class="meta"><span>${esc(g.d)}</span>
            <span>${g.rows.length} testimony filing${g.rows.length===1?'':'s'}</span>
            ${g.bills.size ? `<span>${[...g.bills].slice(0,4).join(', ')}${g.bills.size>4?' +'+(g.bills.size-4):''}</span>`

        </div>
      </div>`; }).join('') + `</div>`
      : `<div class="bubble"><b>No hearings match.</b>Try a committee name or a bill number.</div>`);
}

}
